<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaleForge — Story</title>
  <meta
    name="description"
    content="Read a story on TaleForge."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #0b0d12;
      color: #eceff4;
      min-height: 100vh;
    }

    header {
      font-family: Arial, sans-serif;
      border-bottom: 1px solid #222733;
      padding: 20px;
      position: sticky;
      top: 0;
      background: rgba(11, 13, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: #aab2c0;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #ffffff;
    }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #8f9cff;
      z-index: 100;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 70px 20px 100px;
    }

    .loading {
      text-align: center;
      color: #8993a3;
      padding: 80px 0;
      font-family: Arial, sans-serif;
    }

    .error {
      text-align: center;
      color: #ff9a9a;
      padding: 80px 20px;
      font-family: Arial, sans-serif;
    }

    .genre {
      font-family: Arial, sans-serif;
      color: #aeb9ff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.05;
      margin-bottom: 18px;
    }

    .subtitle {
      color: #aeb6c4;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-family: Arial, sans-serif;
      margin-bottom: 55px;
    }

    .meta span {
      background: #171c25;
      border: 1px solid #272e3a;
      color: #9ca6b6;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
    }

    .story-content {
      font-size: 20px;
      line-height: 1.9;
      color: #e1e5eb;
    }

    .story-content p {
      margin-bottom: 28px;
    }

    .story-content p:last-child {
      margin-bottom: 0;
    }

    .end {
      margin-top: 80px;
      padding-top: 35px;
      border-top: 1px solid #252b36;
      font-family: Arial, sans-serif;
      color: #858f9f;
      text-align: center;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      display: inline-block;
      padding: 11px 17px;
      border-radius: 9px;
      background: #171c25;
      border: 1px solid #2a3140;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
    }

    .button:hover {
      border-color: #5c6780;
    }

    footer {
      border-top: 1px solid #222733;
      padding: 30px 20px;
      text-align: center;
      color: #687282;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main {
        padding-top: 45px;
      }

      .story-content {
        font-size: 18px;
        line-height: 1.85;
      }

      .subtitle {
        font-size: 17px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>

<div class="progress" id="progress"></div>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">TaleForge</a>

    <nav>
      <a href="stories.html">Explore</a>
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="loading">
    Loading story...
  </div>
</main>

<footer>
  TaleForge — Short stories. Infinite worlds.
</footer>

<script type="module">
  import "./supabase-client.js";

  const supabase = window.taleForgeSupabase;
  const main = document.getElementById("main");
  const progress = document.getElementById("progress");

  const params = new URLSearchParams(window.location.search);
  const storyId = params.get("id");

  async function loadStory() {

    if (!storyId) {
      showError("No story was specified.");
      return;
    }

    try {

      const { data, error } = await supabase
        .from("stories")
        .select(`
          id,
          title,
          slug,
          subtitle,
          summary,
          content,
          reading_time,
          word_count,
          mood,
          intensity,
          published_at,
          genres (
            name
          )
        `)
        .eq("id", storyId)
        .eq("status", "published")
        .single();

      if (error) {
        throw error;
      }

      if (!data) {
        showError("Story not found.");
        return;
      }

      renderStory(data);

    } catch (error) {

      console.error(error);

      showError(
        error.message || "Unable to load this story."
      );
    }
  }

  function renderStory(story) {

    document.title =
      `${story.title} — TaleForge`;

    const description =
      story.summary ||
      story.subtitle ||
      "Read this story on TaleForge.";

    const metaDescription =
      document.querySelector('meta[name="description"]');

    if (metaDescription) {
      metaDescription.setAttribute(
        "content",
        description
      );
    }

    const paragraphs =
      String(story.content || "")
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean);

    const contentHtml = paragraphs
      .map(paragraph => {
        return `<p>${escapeHtml(paragraph).replace(/\n/g, "<br>")}</p>`;
      })
      .join("");

    main.innerHTML = `
      <article>

        <div class="genre">
          ${escapeHtml(
            story.genres?.name || "Story"
          )}
        </div>

        <h1>
          ${escapeHtml(story.title)}
        </h1>

        ${
          story.subtitle
            ? `
              <div class="subtitle">
                ${escapeHtml(story.subtitle)}
              </div>
            `
            : ""
        }

        <div class="meta">

          <span>
            ${escapeHtml(String(story.reading_time || 1))} min read
          </span>

          <span>
            ${escapeHtml(String(story.word_count || 0))} words
          </span>

          ${
            story.mood
              ? `<span>${escapeHtml(story.mood)}</span>`
              : ""
          }

          ${
            story.intensity
              ? `<span>${escapeHtml(story.intensity)}</span>`
              : ""
          }

        </div>

        <div class="story-content">
          ${contentHtml}
        </div>

        <div class="end">
          <p>You've reached the end of this story.</p>

          <div class="actions">
            <a class="button" href="stories.html">
              Explore More Stories
            </a>

            <a class="button" href="index.html">
              Back Home
            </a>
          </div>
        </div>

      </article>
    `;
  }

  function showError(message) {

    main.innerHTML = `
      <div class="error">
        <h2>Story unavailable</h2>
        <p>${escapeHtml(message)}</p>
        <br>
        <a class="button" href="stories.html">
          Return to Explore
        </a>
      </div>
    `;
  }

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.addEventListener("scroll", () => {

    const scrollTop =
      window.scrollY;

    const documentHeight =
      document.documentElement.scrollHeight -
      window.innerHeight;

    const percentage =
      documentHeight > 0
        ? (scrollTop / documentHeight) * 100
        : 0;

    progress.style.width =
      `${Math.min(100, Math.max(0, percentage))}%`;
  });

  loadStory();
</script>

</body>
</html>
