<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TaleForge Story</title>

  <meta
    id="metaDescription"
    name="description"
    content="Read short stories on TaleForge."
  >

  <style>

    :root {
      --bg: #090b0f;
      --surface: #11151c;
      --border: #252c36;
      --text: #f0f2f5;
      --muted: #9ca6b4;
      --accent: #05c9ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background: var(--bg);

      color: var(--text);

      line-height: 1.9;

      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;

      background: rgba(9, 11, 15, 0.9);

      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav {
      max-width: 1180px;

      margin: auto;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .logo {
      font-size: 1.6rem;

      font-weight: 800;

      letter-spacing: -0.05em;
    }

    .logo span {
      color: var(--accent);
    }

    .back-link {
      color: var(--muted);

      font-size: 0.92rem;
    }

    .back-link:hover {
      color: var(--text);
    }

    .story-header {
      max-width: 950px;

      margin: auto;

      padding: 120px 20px 90px;

      text-align: center;
    }

    .genre {
      display: inline-block;

      padding: 8px 18px;

      border: 1px solid rgba(5, 201, 238, 0.3);

      border-radius: 999px;

      background: rgba(5, 201, 238, 0.08);

      color: var(--accent);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 0.78rem;

      font-weight: 750;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      margin-bottom: 35px;
    }

    h1 {
      font-size: clamp(3.2rem, 8vw, 7rem);

      line-height: 0.95;

      letter-spacing: -0.06em;

      margin-bottom: 30px;
    }

    .subtitle {
      max-width: 720px;

      margin: auto;

      color: var(--muted);

      font-size: clamp(1.15rem, 2.5vw, 1.55rem);

      font-style: italic;

      line-height: 1.6;
    }

    .story-meta {
      margin-top: 45px;

      color: var(--muted);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 0.92rem;
    }

    .divider {
      width: 70px;

      height: 1px;

      background: var(--border);

      margin: 55px auto 0;
    }

    .story-content {
      max-width: 760px;

      margin: auto;

      padding: 30px 20px 120px;

      font-size: 1.25rem;
    }

    .story-content p {
      margin-bottom: 30px;
    }

    .story-content p:first-child::first-letter {
      float: left;

      font-size: 5.5rem;

      line-height: 0.75;

      padding-right: 12px;

      color: var(--accent);
    }

    .story-end {
      text-align: center;

      margin-top: 80px;

      padding-top: 50px;

      border-top: 1px solid var(--border);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .story-end-title {
      font-size: 1.2rem;

      font-weight: 700;

      margin-bottom: 22px;
    }

    .discover-link {
      display: inline-flex;

      padding: 14px 20px;

      border-radius: 12px;

      background: var(--accent);

      color: #061014;

      font-weight: 750;
    }

    .not-found {
      max-width: 700px;

      margin: 120px auto;

      padding: 50px 25px;

      text-align: center;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;
    }

    .not-found h1 {
      font-size: 3rem;

      margin-bottom: 20px;
    }

    .not-found p {
      color: var(--muted);

      margin-bottom: 30px;
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);

      padding: 30px 20px;

      text-align: center;

      color: var(--muted);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        sans-serif;

      font-size: 0.82rem;
    }

    @media (max-width: 650px) {

      .nav {
        padding: 16px;
      }

      .story-header {
        padding: 90px 20px 65px;
      }

      .story-content {
        font-size: 1.12rem;

        line-height: 1.85;
      }

      h1 {
        font-size: 3.5rem;
      }

    }

  </style>

</head>

<body>

  <header>

    <nav class="nav">

      <a href="index.html" class="logo">
        Tale<span>Forge</span>
      </a>

      <a href="stories.html" class="back-link">
        ← Back to Stories
      </a>

    </nav>

  </header>


  <main id="app"></main>


  <footer>
    © 2026 TaleForge · Short stories. Infinite worlds.
  </footer>


  <script src="stories-data.js"></script>


  <script>

    function getStoryId() {

      const parameters =
        new URLSearchParams(window.location.search);

      return parameters.get("id");

    }


    function showNotFound() {

      document.getElementById("app").innerHTML = `
        <section class="not-found">

          <h1>
            Story not found
          </h1>

          <p>
            We couldn't find the story you're looking for.
          </p>

          <a
            href="stories.html"
            class="discover-link"
          >
            ← Explore Stories
          </a>

        </section>
      `;

      document.title =
        "Story Not Found — TaleForge";

    }


    function renderStory(story) {

      document.title =
        story.title + " — TaleForge";


      document
        .getElementById("metaDescription")
        .setAttribute(
          "content",
          story.summary
        );


      const paragraphs =
        story.content
          .split("\n\n")
          .filter(function(paragraph) {
            return paragraph.trim() !== "";
          });


      let contentHTML = "";


      paragraphs.forEach(function(paragraph) {

        const paragraphElement =
          document.createElement("p");

        paragraphElement.textContent =
          paragraph.trim();

        contentHTML +=
          paragraphElement.outerHTML;

      });


      document.getElementById("app").innerHTML = `

        <section class="story-header">

          <div class="genre">
            ${story.genre}
          </div>

          <h1>
            ${story.title}
          </h1>

          <p class="subtitle">
            ${story.subtitle}
          </p>

          <div class="story-meta">
            TaleForge Original ·
            ${story.readingTime} min read
          </div>

          <div class="divider"></div>

        </section>


        <article class="story-content">

          ${contentHTML}


          <div class="story-end">

            <div class="story-end-title">
              End of Story
            </div>

            <a
              href="stories.html"
              class="discover-link"
            >
              Discover Another Story →
            </a>

          </div>

        </article>

      `;

    }


    const storyId =
      getStoryId();


    const story =
      TALEFORGE_STORIES.find(function(item) {

        return item.id === storyId;

      });


    if (
      !story ||
      story.status !== "published" ||
      !story.content
    ) {

      showNotFound();

    } else {

      renderStory(story);

    }

  </script>

</body>
</html>
