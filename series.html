<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaleForge — Series</title><style>
:root{--bg:#090a0c;--panel:#111316;--line:rgba(255,255,255,.09);--text:#f5f1e8;--muted:#a7a39b;--gold:#d6b36a;--gold2:#f0d99c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,rgba(214,179,106,.12),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:74px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(9,10,12,.82);backdrop-filter:blur(20px)}.navin{max-width:1240px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{font:25px Georgia,serif}.brand b{color:var(--gold);font-weight:600}.back{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:#c8c3ba;font-size:13px;font-weight:700;transition:.2s}.back:hover{color:var(--text);border-color:rgba(214,179,106,.5);transform:translateY(-1px)}main{max-width:1240px;margin:auto;padding:55px 24px 90px}.hero{display:grid;grid-template-columns:310px 1fr;gap:55px;align-items:center;min-height:530px}.cover{height:435px;border:1px solid var(--line);background:linear-gradient(145deg,#252017,#111316 62%);position:relative;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.35)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5))}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:34px/1.05 Georgia,serif;color:#eee1c4}.placeholder small{display:block;color:var(--gold);font:800 10px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800}.hero h1{font:500 clamp(50px,7vw,84px)/.92 Georgia,serif;letter-spacing:-3px;margin:16px 0}.subtitle{font:21px/1.55 Georgia,serif;color:#c4c0b7;max-width:750px}.description{color:#99958d;line-height:1.75;max-width:760px;margin-top:20px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:23px}.meta span{padding:7px 10px;border:1px solid var(--line);color:#9c9890;font-size:11px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border:1px solid var(--line);border-radius:8px;background:#121416;font-size:13px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:rgba(214,179,106,.45)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#16120a}.section{margin-top:70px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}.head h2{font:500 34px Georgia,serif;margin:0}.head p{color:#77736c;font-size:12px}.chapter{display:grid;grid-template-columns:80px 1fr auto;gap:20px;align-items:center;padding:22px 5px;border-bottom:1px solid var(--line);transition:.2s}.chapter:hover{background:rgba(255,255,255,.025);padding-left:12px;padding-right:12px}.num{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.13em}.ctitle{font:500 20px Georgia,serif}.summary{font-size:13px;color:#85817a;margin-top:5px;max-width:700px}.time{font-size:11px;color:#706c65}.empty{padding:35px;color:var(--muted);border:1px dashed var(--line)}footer{border-top:1px solid var(--line);padding:35px 24px;text-align:center;color:#706c65;font-size:12px}@media(max-width:760px){main{padding:35px 17px 70px}.hero{grid-template-columns:1fr;gap:30px}.cover{height:435px;max-width:290px}.hero h1{font-size:52px}.chapter{grid-template-columns:55px 1fr}.time{grid-column:2}} </style></head><body>
<header class="nav"><div class="navin"><a class="brand" href="index.html">Tale<b>Forge</b></a><a class="back" href="stories.html">← Explore</a></div></header><main id="app"><div class="empty">Opening story…</div></main><footer>© 2026 TaleForge · Short stories. Infinite worlds.</footer>
<script type="module">import "./supabase-client.js";import "./reading-progress.js";const app=document.getElementById("app"),supabase=window.taleForgeSupabase,esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};const status=v=>v?v[0].toUpperCase()+v.slice(1):"";
async function load(){const p=new URLSearchParams(location.search),id=p.get("id"),slug=p.get("slug");if(!id&&!slug)return err("No story was specified.");let q=supabase.from("series").select("id,title,slug,subtitle,description,cover_image,status,age_rating,mood,intensity,chapter_count,views,followers_count,published_at,genres(name)");q=id?q.eq("id",id):q.eq("slug",slug);const {data:s,error}=await q.single();if(error||!s)return err("This story is not available for public reading.");const {data:c,error:ce}=await supabase.from("chapters").select("id,chapter_number,title,subtitle,summary,word_count,reading_time,published_at,status").eq("series_id",s.id).eq("status","published").order("chapter_number",{ascending:true});if(ce)return err("The story loaded, but its chapters could not be loaded.");render(s,c||[])}
function render(s,c){document.title=s.title+" — TaleForge";const g=s.genres?.name||"Fiction";const cover=s.cover_image?'<img src="'+esc(s.cover_image)+'" alt="'+esc(s.title)+' cover">':'<div class="placeholder"><div><small>'+esc(g)+'</small>'+esc(s.title)+'</div></div>';const first=c[0],saved=window.taleForgeProgress?.getProgress(s.id),resume=saved&&saved.chapterId&&saved.percent<98?c.find(x=>x.id===saved.chapterId):null;app.innerHTML='<section class="hero"><div class="cover">'+cover+'</div><div><div class="eyebrow">'+esc(g)+' · '+esc(status(s.status))+'</div><h1>'+esc(s.title)+'</h1>'+(s.subtitle?'<div class="subtitle">'+esc(s.subtitle)+'</div>':"")+(s.description?'<p class="description">'+esc(s.description)+'</p>':"")+'<div class="meta"><span>'+esc(status(s.status))+'</span><span>'+esc(c.length)+' published chapters</span>'+(s.age_rating?'<span>'+esc(s.age_rating)+'</span>':"")+(s.mood?'<span>'+esc(s.mood)+'</span>':"")+(s.intensity?'<span>'+esc(s.intensity)+' intensity</span>':"")+'</div><div class="actions">'+(resume?'<a class="btn primary" href="chapter.html?id='+encodeURIComponent(resume.id)+'">Resume · '+Math.round(saved.percent||0)+'% →</a>':(first?'<a class="btn primary" href="chapter.html?id='+encodeURIComponent(first.id)+'">Start reading →</a>':'<span class="btn">Coming soon</span>'))+'<button id="followBtn" class="btn" type="button">Follow story</button><a class="btn" href="stories.html">Back to explore</a></div></div></section><section class="section"><div class="head"><div><div class="eyebrow">The reading order</div><h2>Chapters</h2></div><p>'+c.length+' published</p></div>'+(c.length?c.map(x=>'<a class="chapter" href="chapter.html?id='+encodeURIComponent(x.id)+'"><div class="num">CHAPTER '+esc(x.chapter_number)+'</div><div><div class="ctitle">'+esc(x.title)+'</div>'+(x.summary?'<div class="summary">'+esc(x.summary)+'</div>':"")+'</div><div class="time">'+esc(x.reading_time||"")+' min</div></a>').join(""):'<div class="empty">No published chapters yet.</div>')+'</section>';wireLibrary(s)}
function wireLibrary(s){const b=document.getElementById("followBtn");if(!b)return;const update=()=>{b.textContent=window.taleForgeProgress.isFollowing(s.id)?"Following ✓":"Follow story";b.style.borderColor=window.taleForgeProgress.isFollowing(s.id)?"rgba(214,179,106,.55)":""};b.onclick=()=>{if(window.taleForgeProgress.isFollowing(s.id)){window.taleForgeProgress.unfollowSeries(s.id);window.taleForgeProgress.track("unfollow",{seriesId:s.id})}else{window.taleForgeProgress.followSeries({seriesId:s.id,seriesTitle:s.title,genre:s.genres?.name||"Fiction"});window.taleForgeProgress.track("follow",{seriesId:s.id})}update()};update()}
function err(m){app.innerHTML='<div class="empty" style="margin:80px auto;max-width:700px;text-align:center"><h2 style="font:500 34px Georgia,serif;color:#f5f1e8">Story unavailable</h2><p>'+esc(m)+'</p><a class="btn" href="stories.html">Back to explore</a></div>'}load();</script></body></html>
