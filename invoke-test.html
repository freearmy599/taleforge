<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TaleForge Chapter Revision Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0b0d12;
      color: #e8edf5;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #9aa6b6;
      line-height: 1.6;
    }

    .info {
      margin-top: 20px;
      padding: 16px;
      background: #121722;
      border: 1px solid #263142;
      border-radius: 12px;
    }

    .info strong {
      color: #e8edf5;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: #19c8ff;
      color: #001018;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    pre {
      margin-top: 24px;
      padding: 18px;
      background: #121722;
      border: 1px solid #263142;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      color: #dce5f2;
    }
  </style>
</head>

<body>

<main>

  <h1>TaleForge Chapter Revision Test</h1>

  <p>
    This test sends the latest rejected Chapter 2 output
    to the TaleForge revision engine.
  </p>

  <div class="info">

    <div>
      <strong>Series:</strong>
      The Clockwork Sky
    </div>

    <div>
      <strong>Chapter:</strong>
      2 — The Sound Beneath the City
    </div>

    <div>
      <strong>Target:</strong>
      4,000 words
    </div>

    <div>
      <strong>Minimum:</strong>
      3,400 words
    </div>

    <div>
      <strong>Maximum:</strong>
      4,600 words
    </div>

  </div>

  <button id="run">
    Run Chapter Revision
  </button>

  <pre id="result">Ready...</pre>

</main>

<script type="module">

  import "./supabase-client.js";

  const button =
    document.getElementById("run");

  const result =
    document.getElementById("result");

  /*
   * This is the latest output that failed
   * the 3,400-word production minimum.
   */
  const OUTPUT_ID =
    "8348f2ef-5ffc-4e18-b499-3cf2662c0884";

  button.addEventListener(
    "click",
    async () => {

      button.disabled = true;

      result.textContent =
        "Running TaleForge chapter revision...\n\n" +
        "Please wait. The revision engine may make multiple\n" +
        "internal attempts to reach the production minimum.\n";

      try {

        const supabase =
          window.taleForgeSupabase;

        if (!supabase) {
          throw new Error(
            "Supabase client was not initialized."
          );
        }

        const {
          data,
          error
        } =
          await supabase.functions.invoke(
            "revise-chapter",
            {
              body: {
                output_id:
                  OUTPUT_ID
              }
            }
          );

        if (error) {
          throw error;
        }

        result.textContent =
          JSON.stringify(
            data,
            null,
            2
          );

      } catch (error) {

        result.textContent =
          "ERROR:\n\n" +
          (
            error?.message ||
            String(error)
          );

      } finally {

        button.disabled = false;

      }

    }
  );

</script>

</body>
</html>
