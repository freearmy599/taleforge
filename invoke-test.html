<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaleForge Continuity Review Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f14;
      color: #e8eef5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 20px 0;
      border: 0;
      border-radius: 10px;
      background: #00c2ff;
      color: #001018;
      font-size: 16px;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111820;
      border: 1px solid #263340;
      border-radius: 10px;
      padding: 16px;
      line-height: 1.5;
    }

    .ok {
      color: #55ff99;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TaleForge Continuity Review</h1>

  <p id="pageStatus">
    Loading test page...
  </p>

  <button id="runButton">
    Run Continuity Review
  </button>

  <pre id="result">Waiting...</pre>

</div>

<script type="module">

  const result = document.getElementById("result");
  const pageStatus = document.getElementById("pageStatus");
  const runButton = document.getElementById("runButton");

  result.textContent = "JavaScript loaded successfully.";

  let supabaseClient = null;

  try {

    const module = await import("./supabase-client.js");

    if (!module.supabase) {
      throw new Error(
        "supabase-client.js loaded, but it does not export 'supabase'."
      );
    }

    supabaseClient = module.supabase;

    pageStatus.textContent =
      "Supabase client loaded. The test is ready.";

    pageStatus.className = "ok";

    result.textContent =
      "Ready.\n\nTap 'Run Continuity Review'.";

  } catch (error) {

    pageStatus.textContent =
      "Supabase client failed to load.";

    pageStatus.className = "error";

    result.textContent =
      "ERROR LOADING SUPABASE CLIENT\n\n" +
      (error?.message || String(error));

    runButton.disabled = true;
  }


  runButton.addEventListener("click", async () => {

    if (!supabaseClient) {
      result.textContent =
        "Supabase client is not available.";

      return;
    }

    runButton.disabled = true;

    pageStatus.textContent =
      "Continuity review is running...";

    result.textContent =
      "Calling continuity-review Edge Function...\n\n" +
      "Please wait.";

    const OUTPUT_ID =
      "a980c498-1c9d-46c6-95fe-3490ec48432f";

    try {

      const { data, error } =
        await supabaseClient.functions.invoke(
          "continuity-review",
          {
            body: {
              output_id: OUTPUT_ID
            }
          }
        );

      if (error) {

        pageStatus.textContent =
          "Edge Function returned an error.";

        pageStatus.className = "error";

        result.textContent =
          JSON.stringify(
            {
              type: "supabase_function_error",
              message: error.message,
              details: error
            },
            null,
            2
          );

        return;
      }

      pageStatus.textContent =
        "Continuity review completed.";

      pageStatus.className = "ok";

      result.textContent =
        JSON.stringify(data, null, 2);

    } catch (error) {

      pageStatus.textContent =
        "Unexpected error.";

      pageStatus.className = "error";

      result.textContent =
        JSON.stringify(
          {
            type: "unexpected_error",
            message: error?.message || String(error),
            stack: error?.stack || null
          },
          null,
          2
        );

    } finally {

      runButton.disabled = false;

    }

  });

</script>

</body>
</html>
