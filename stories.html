<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Explore the TaleForge short story library."
  >

  <title>Explore Stories — TaleForge</title>

  <style>

    :root {
      --bg: #090b0f;
      --surface: #11151c;
      --surface-2: #151a22;
      --border: #252c36;
      --text: #f0f2f5;
      --muted: #9ca6b4;
      --accent: #05c9ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);

      color: var(--text);

      line-height: 1.6;

      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;

      top: 0;

      z-index: 50;

      background: rgba(9, 11, 15, 0.9);

      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }

    .nav {
      max-width: 1180px;

      margin: auto;

      padding: 18px 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .logo {
      font-size: 1.55rem;

      font-weight: 850;

      letter-spacing: -0.06em;
    }

    .logo span {
      color: var(--accent);
    }

    .back-link {
      color: var(--muted);

      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--text);
    }

    .hero {
      max-width: 1180px;

      margin: auto;

      padding: 100px 20px 60px;
    }

    .eyebrow {
      color: var(--accent);

      font-size: 0.76rem;

      font-weight: 800;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      margin-bottom: 18px;
    }

    h1 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(3.5rem, 8vw, 6rem);

      line-height: 0.95;

      letter-spacing: -0.06em;

      margin-bottom: 20px;
    }

    .hero p {
      max-width: 650px;

      color: var(--muted);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.15rem;

      line-height: 1.7;
    }

    .controls {
      max-width: 1180px;

      margin: auto;

      padding: 0 20px 45px;

      display: flex;

      gap: 12px;

      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;

      min-width: 240px;
    }

    input,
    select {
      width: 100%;

      padding: 14px 16px;

      border-radius: 12px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      outline: none;

      font: inherit;
    }

    input:focus,
    select:focus {
      border-color:
        rgba(5, 201, 238, 0.55);
    }

    .select-box {
      width: 210px;
    }

    .library {
      max-width: 1180px;

      margin: auto;

      padding: 0 20px 100px;
    }

    .library-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 25px;

      color: var(--muted);

      font-size: 0.88rem;
    }

    .story-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }

    .story-card {
      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 25px;

      min-height: 290px;

      display: flex;

      flex-direction: column;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .story-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(5, 201, 238, 0.45);
    }

    .genre {
      display: inline-block;

      width: fit-content;

      padding: 6px 11px;

      border-radius: 999px;

      background:
        rgba(5, 201, 238, 0.08);

      border:
        1px solid rgba(5, 201, 238, 0.22);

      color: var(--accent);

      font-size: 0.7rem;

      font-weight: 800;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      margin-bottom: 24px;
    }

    .story-card h2 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.7rem;

      line-height: 1.08;

      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;

      margin-bottom: 12px;
    }

    .summary {
      color: var(--muted);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.94rem;

      line-height: 1.65;

      flex: 1;
    }

    .card-bottom {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-top: 25px;

      padding-top: 17px;

      border-top:
        1px solid var(--border);
    }

    .time {
      color: var(--muted);

      font-size: 0.78rem;
    }

    .read-link {
      color: var(--accent);

      font-size: 0.84rem;

      font-weight: 750;
    }

    .coming-soon {
      color: var(--muted);

      font-size: 0.82rem;

      font-weight: 700;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 70px 25px;

      text-align: center;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 18px;

      color: var(--muted);
    }

    footer {
      border-top:
        1px solid rgba(255, 255, 255, 0.06);

      padding: 35px 20px;

      text-align: center;

      color: var(--muted);

      font-size: 0.82rem;
    }

    @media (max-width: 850px) {

      .story-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .nav {
        padding: 15px;
      }

      .hero {
        padding:
          75px 20px 45px;
      }

      h1 {
        font-size: 3.6rem;
      }

      .controls {
        display: block;
      }

      .search-box,
      .select-box {
        width: 100%;

        margin-bottom: 10px;
      }

      .story-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav class="nav">

      <a
        href="index.html"
        class="logo"
      >
        Tale<span>Forge</span>
      </a>


      <a
        href="index.html"
        class="back-link"
      >
        ← Home
      </a>

    </nav>

  </header>



  <main>


    <section class="hero">

      <div class="eyebrow">
        TaleForge Library
      </div>


      <h1>
        Explore Stories.
      </h1>


      <p>
        Search the TaleForge collection or
        choose a genre to discover your next story.
      </p>

    </section>



    <div class="controls">

      <div class="search-box">

        <input
          id="searchInput"
          type="search"
          placeholder="Search stories..."
          autocomplete="off"
        >

      </div>


      <div class="select-box">

        <select id="genreFilter">

          <option value="all">
            All Genres
          </option>

        </select>

      </div>

    </div>



    <section class="library">

      <div class="library-top">

        <span id="storyCount">
          Loading stories...
        </span>

        <span>
          TaleForge
        </span>

      </div>


      <div
        id="storyGrid"
        class="story-grid"
      ></div>

    </section>


  </main>



  <footer>

    © 2026 TaleForge ·
    Short stories. Infinite worlds.

  </footer>



  <script src="stories-data.js"></script>


  <script>

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const genreFilter =
      document.getElementById(
        "genreFilter"
      );


    const storyGrid =
      document.getElementById(
        "storyGrid"
      );


    const storyCount =
      document.getElementById(
        "storyCount"
      );



    function getGenreFromURL() {

      const parameters =
        new URLSearchParams(
          window.location.search
        );


      return parameters.get("genre");

    }



    function buildGenreFilter() {

      const genres = [];


      TALEFORGE_STORIES.forEach(
        function(story) {

          if (
            story.genre &&
            !genres.includes(story.genre)
          ) {

            genres.push(story.genre);

          }

        }
      );


      genres.sort();


      genres.forEach(
        function(genre) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            genre;

          option.textContent =
            genre;

          genreFilter.appendChild(
            option
          );

        }
      );


      const urlGenre =
        getGenreFromURL();


      if (
        urlGenre &&
        genres.includes(urlGenre)
      ) {

        genreFilter.value =
          urlGenre;

      }

    }



    function createStoryCard(story) {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "story-card";


      const genre =
        document.createElement(
          "div"
        );

      genre.className =
        "genre";

      genre.textContent =
        story.genre;


      const title =
        document.createElement(
          "h2"
        );

      title.textContent =
        story.title;


      const subtitle =
        document.createElement(
          "div"
        );

      subtitle.className =
        "subtitle";

      subtitle.textContent =
        story.subtitle;


      const summary =
        document.createElement(
          "p"
        );

      summary.className =
        "summary";

      summary.textContent =
        story.summary;


      const bottom =
        document.createElement(
          "div"
        );

      bottom.className =
        "card-bottom";


      const time =
        document.createElement(
          "span"
        );

      time.className =
        "time";

      time.textContent =
        story.readingTime +
        " min read";


      bottom.appendChild(time);


      if (
        story.status === "published" &&
        story.storyPage
      ) {

        const link =
          document.createElement(
            "a"
          );

        link.className =
          "read-link";

        link.href =
          story.storyPage;

        link.textContent =
          "Read story →";

        bottom.appendChild(link);

      } else {

        const comingSoon =
          document.createElement(
            "span"
          );

        comingSoon.className =
          "coming-soon";

        comingSoon.textContent =
          "Coming soon";

        bottom.appendChild(
          comingSoon
        );

      }


      card.appendChild(genre);

      card.appendChild(title);

      card.appendChild(subtitle);

      card.appendChild(summary);

      card.appendChild(bottom);


      return card;

    }



    function renderStories() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const selectedGenre =
        genreFilter.value;


      const filtered =
        TALEFORGE_STORIES.filter(
          function(story) {

            const matchesSearch =
              !search ||
              story.title
                .toLowerCase()
                .includes(search) ||
              story.genre
                .toLowerCase()
                .includes(search) ||
              story.summary
                .toLowerCase()
                .includes(search) ||
              story.subtitle
                .toLowerCase()
                .includes(search);


            const matchesGenre =
              selectedGenre === "all" ||
              story.genre === selectedGenre;


            return (
              matchesSearch &&
              matchesGenre
            );

          }
        );


      storyGrid.innerHTML = "";


      storyCount.textContent =
        filtered.length +
        (
          filtered.length === 1
            ? " story"
            : " stories"
        );


      if (
        filtered.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty";

        empty.textContent =
          "No stories match your search.";

        storyGrid.appendChild(
          empty
        );

        return;

      }


      filtered.forEach(
        function(story) {

          storyGrid.appendChild(
            createStoryCard(story)
          );

        }
      );

    }



    buildGenreFilter();


    searchInput.addEventListener(
      "input",
      renderStories
    );


    genreFilter.addEventListener(
      "change",
      renderStories
    );


    renderStories();

  </script>


</body>

  </html>
