<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaleForge — Explore Stories</title>
  <meta
    name="description"
    content="Discover short stories across fantasy, mystery, science fiction, horror, thriller, comedy, drama and more."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #f5f7fa;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid #222733;
      padding: 20px;
      position: sticky;
      top: 0;
      background: rgba(11, 13, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: #aab2c0;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #ffffff;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 50px 20px 80px;
    }

    .hero {
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .hero p {
      color: #9ca5b5;
      max-width: 650px;
      line-height: 1.7;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 180px 180px;
      gap: 12px;
      margin-bottom: 30px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #292f3b;
      border-radius: 10px;
      background: #12161e;
      color: #ffffff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #6d7cff;
    }

    .status {
      color: #8f99a8;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .error {
      color: #ff8e8e;
      background: #251519;
      border: 1px solid #52242c;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .library {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #12161e;
      border: 1px solid #252b36;
      border-radius: 16px;
      padding: 22px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #46516a;
    }

    .genre {
      display: inline-block;
      color: #aeb9ff;
      font-size: 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .card h2 a {
      color: #ffffff;
      text-decoration: none;
    }

    .card h2 a:hover {
      color: #c5ccff;
    }

    .subtitle {
      color: #aeb6c4;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #7f8999;
      font-size: 12px;
      margin-top: 15px;
    }

    .meta span {
      background: #191e27;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #8f99a8;
    }

    footer {
      border-top: 1px solid #222733;
      padding: 30px 20px;
      text-align: center;
      color: #6f7887;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .library {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        width: 100%;
        justify-content: space-between;
      }

      .library {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">TaleForge</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="stories.html">Explore</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Explore Stories</h1>
    <p>
      Discover short stories across different worlds, genres, moods and
      reading experiences.
    </p>
  </section>

  <section class="controls">
    <input
      id="search"
      type="search"
      placeholder="Search stories..."
      autocomplete="off"
    >

    <select id="genreFilter">
      <option value="">All genres</option>
    </select>

    <select id="sortFilter">
      <option value="newest">Newest</option>
      <option value="title">Title</option>
      <option value="shortest">Shortest</option>
      <option value="longest">Longest</option>
    </select>
  </section>

  <div id="status" class="status">
    Loading stories...
  </div>

  <div id="error"></div>

  <section id="library" class="library"></section>

</main>

<footer>
  TaleForge — Short stories. Infinite worlds.
</footer>

<script type="module">
  import "./supabase-client.js";

  const supabase = window.taleForgeSupabase;

  const library = document.getElementById("library");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");

  const searchInput = document.getElementById("search");
  const genreFilter = document.getElementById("genreFilter");
  const sortFilter = document.getElementById("sortFilter");

  let stories = [];

  async function loadStories() {
    try {
      status.textContent = "Loading stories...";
      errorBox.innerHTML = "";

      const { data, error } = await supabase
        .from("stories")
        .select(`
          id,
          title,
          slug,
          subtitle,
          summary,
          reading_time,
          word_count,
          mood,
          intensity,
          published_at,
          genres (
            name,
            slug
          )
        `)
        .eq("status", "published")
        .order("published_at", { ascending: false });

      if (error) {
        throw error;
      }

      stories = data || [];

      buildGenreFilter();
      renderStories();

    } catch (error) {
      console.error(error);

      status.textContent = "Unable to load stories.";

      errorBox.innerHTML = `
        <div class="error">
          Database error: ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  function buildGenreFilter() {
    const genres = [...new Set(
      stories
        .map(story => story.genres?.name)
        .filter(Boolean)
    )].sort();

    genreFilter.innerHTML = `<option value="">All genres</option>`;

    genres.forEach(genre => {
      const option = document.createElement("option");
      option.value = genre;
      option.textContent = genre;
      genreFilter.appendChild(option);
    });
  }

  function renderStories() {
    const search = searchInput.value.trim().toLowerCase();
    const selectedGenre = genreFilter.value;
    const sort = sortFilter.value;

    let filtered = stories.filter(story => {

      const searchableText = [
        story.title,
        story.subtitle,
        story.summary,
        story.genres?.name,
        story.mood
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const matchesSearch =
        !search || searchableText.includes(search);

      const matchesGenre =
        !selectedGenre ||
        story.genres?.name === selectedGenre;

      return matchesSearch && matchesGenre;
    });

    if (sort === "title") {
      filtered.sort((a, b) =>
        a.title.localeCompare(b.title)
      );
    }

    if (sort === "shortest") {
      filtered.sort((a, b) =>
        (a.reading_time || 0) - (b.reading_time || 0)
      );
    }

    if (sort === "longest") {
      filtered.sort((a, b) =>
        (b.reading_time || 0) - (a.reading_time || 0)
      );
    }

    status.textContent =
      `${filtered.length} ${filtered.length === 1 ? "story" : "stories"} found`;

    library.innerHTML = "";

    if (filtered.length === 0) {
      library.innerHTML = `
        <div class="empty">
          <h2>No stories found</h2>
          <p>Try another search or genre.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(story => {

      const card = document.createElement("article");
      card.className = "card";

      const genre = story.genres?.name || "Uncategorized";

      card.innerHTML = `
        <div class="genre">${escapeHtml(genre)}</div>

        <h2>
          <a href="story.html?id=${encodeURIComponent(story.id)}">
            ${escapeHtml(story.title)}
          </a>
        </h2>

        <p class="subtitle">
          ${escapeHtml(
            story.subtitle ||
            story.summary ||
            "A TaleForge story."
          )}
        </p>

        <div class="meta">
          <span>${escapeHtml(String(story.reading_time || 1))} min</span>
          ${
            story.mood
              ? `<span>${escapeHtml(story.mood)}</span>`
              : ""
          }
          ${
            story.intensity
              ? `<span>${escapeHtml(story.intensity)}</span>`
              : ""
          }
        </div>
      `;

      library.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  searchInput.addEventListener("input", renderStories);
  genreFilter.addEventListener("change", renderStories);
  sortFilter.addEventListener("change", renderStories);

  loadStories();
</script>

</body>
</html>
