<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Explore Stories — TaleForge</title>

  <meta
    name="description"
    content="Explore short stories across mystery, fantasy, science fiction, horror, comedy, thriller and more on TaleForge."
  >


  <style>

    :root {
      --bg: #090b0f;
      --surface: #11151c;
      --surface-2: #151a22;
      --border: #252c36;
      --text: #f0f2f5;
      --muted: #9ca6b4;
      --accent: #05c9ee;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        sans-serif;

      background: var(--bg);

      color: var(--text);

      min-height: 100vh;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    header {
      position: sticky;
      top: 0;
      z-index: 30;

      background:
        rgba(9, 11, 15, 0.92);

      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255, 255, 255, 0.06);
    }


    .nav {
      max-width: 1180px;
      margin: auto;

      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .logo {
      font-size: 1.55rem;
      font-weight: 850;
      letter-spacing: -0.06em;
    }


    .logo span {
      color: var(--accent);
    }


    .home-link {
      color: var(--muted);
      font-size: 0.9rem;
    }


    .home-link:hover {
      color: var(--text);
    }


    .hero {
      max-width: 1180px;
      margin: auto;

      padding:
        90px 20px 55px;
    }


    .eyebrow {
      color: var(--accent);

      font-size: 0.75rem;
      font-weight: 800;

      letter-spacing: 0.14em;
      text-transform: uppercase;

      margin-bottom: 18px;
    }


    h1 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(3rem, 7vw, 5.5rem);

      line-height: 0.95;

      letter-spacing: -0.06em;

      margin-bottom: 20px;
    }


    .hero p {
      max-width: 650px;

      color: var(--muted);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.15rem;

      line-height: 1.7;
    }


    .controls {
      max-width: 1180px;
      margin: auto;

      padding: 0 20px 45px;
    }


    .control-grid {
      display: grid;

      grid-template-columns:
        2fr
        repeat(4, 1fr);

      gap: 12px;
    }


    .search-box,
    select {
      width: 100%;

      padding: 14px 15px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background: var(--surface);

      color: var(--text);

      font: inherit;

      outline: none;
    }


    .search-box::placeholder {
      color: #68717d;
    }


    .search-box:focus,
    select:focus {
      border-color:
        rgba(5, 201, 238, 0.55);
    }


    select {
      cursor: pointer;
    }


    .library-header {
      max-width: 1180px;
      margin: auto;

      padding:
        0 20px 25px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;
    }


    .result-count {
      color: var(--muted);

      font-size: 0.9rem;
    }


    .featured-toggle {
      border:
        1px solid var(--border);

      background: var(--surface);

      color: var(--muted);

      padding:
        9px 13px;

      border-radius: 10px;

      cursor: pointer;

      font: inherit;
    }


    .featured-toggle.active {
      color: var(--accent);

      border-color:
        rgba(5, 201, 238, 0.4);

      background:
        rgba(5, 201, 238, 0.08);
    }


    .library {
      max-width: 1180px;
      margin: auto;

      padding:
        0 20px 100px;
    }


    .story-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }


    .story-card {
      display: flex;

      flex-direction: column;

      min-height: 285px;

      padding: 24px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 18px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }


    .story-card:hover {
      transform: translateY(-4px);

      border-color:
        rgba(5, 201, 238, 0.4);
    }


    .card-top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 20px;
    }


    .genre {
      color: var(--accent);

      font-size: 0.7rem;

      font-weight: 800;

      letter-spacing: 0.1em;

      text-transform: uppercase;
    }


    .featured {
      padding:
        5px 8px;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.06);

      color: #d8dde4;

      font-size: 0.68rem;

      font-weight: 700;
    }


    .story-card h2 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.65rem;

      line-height: 1.1;

      letter-spacing: -0.035em;

      margin-bottom: 10px;
    }


    .subtitle {
      color: #c2c8d0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;

      line-height: 1.5;

      margin-bottom: 13px;
    }


    .summary {
      color: var(--muted);

      font-size: 0.88rem;

      line-height: 1.6;

      margin-bottom: 20px;
    }


    .card-meta {
      margin-top: auto;

      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }


    .meta-pill {
      padding:
        5px 8px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      color: var(--muted);

      font-size: 0.68rem;
    }


    .read-link {
      margin-top: 20px;

      color: var(--accent);

      font-size: 0.86rem;

      font-weight: 750;
    }


    .empty {
      text-align: center;

      padding:
        80px 20px;

      color: var(--muted);
    }


    .empty h2 {
      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 2rem;

      margin-bottom: 10px;
    }


    footer {
      border-top:
        1px solid rgba(255, 255, 255, 0.06);

      padding: 30px 20px;

      text-align: center;

      color: var(--muted);

      font-size: 0.8rem;
    }


    @media (max-width: 950px) {

      .control-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }


      .control-grid
        .search-wrap {
        grid-column:
          1 / -1;
      }


      .story-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 650px) {

      .nav {
        padding: 15px;
      }


      .hero {
        padding:
          70px 20px 45px;
      }


      h1 {
        font-size: 3.4rem;
      }


      .control-grid {
        grid-template-columns: 1fr;
      }


      .control-grid
        .search-wrap {
        grid-column: auto;
      }


      .library-header {
        align-items: flex-start;

        flex-direction: column;
      }


      .story-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav class="nav">

      <a
        href="index.html"
        class="logo"
      >
        Tale<span>Forge</span>
      </a>


      <a
        href="index.html"
        class="home-link"
      >
        ← Home
      </a>

    </nav>

  </header>



  <main>


    <section class="hero">

      <div class="eyebrow">
        TaleForge Library
      </div>


      <h1>
        Explore Stories.
      </h1>


      <p>
        Discover short stories across different worlds,
        genres, moods and reading lengths.
      </p>

    </section>



    <section class="controls">

      <div class="control-grid">


        <div class="search-wrap">

          <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="Search stories..."
            autocomplete="off"
          >

        </div>


        <select id="genreFilter">

          <option value="">
            All genres
          </option>

        </select>


        <select id="moodFilter">

          <option value="">
            All moods
          </option>

        </select>


        <select id="intensityFilter">

          <option value="">
            All intensity
          </option>

        </select>


        <select id="sortFilter">

          <option value="newest">
            Newest
          </option>

          <option value="title">
            Title A–Z
          </option>

          <option value="shortest">
            Shortest
          </option>

          <option value="longest">
            Longest
          </option>

        </select>


      </div>

    </section>



    <section class="library-header">

      <div
        id="resultCount"
        class="result-count"
      >
        Loading stories...
      </div>


      <button
        id="featuredToggle"
        class="featured-toggle"
        type="button"
      >
        ⭐ Featured only
      </button>

    </section>



    <section class="library">

      <div
        id="storyGrid"
        class="story-grid"
      ></div>


      <div
        id="emptyState"
        class="empty"
        style="display: none;"
      >

        <h2>
          No stories found
        </h2>

        <p>
          Try changing your search or filters.
        </p>

      </div>

    </section>


  </main>



  <footer>

    © 2026 TaleForge ·
    Short stories. Infinite worlds.

  </footer>



  <script type="module">
  import "./supabase-client.js";
  </script> 


  <script>


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const genreFilter =
      document.getElementById(
        "genreFilter"
      );


    const moodFilter =
      document.getElementById(
        "moodFilter"
      );


    const intensityFilter =
      document.getElementById(
        "intensityFilter"
      );


    const sortFilter =
      document.getElementById(
        "sortFilter"
      );


    const featuredToggle =
      document.getElementById(
        "featuredToggle"
      );


    const storyGrid =
      document.getElementById(
        "storyGrid"
      );


    const emptyState =
      document.getElementById(
        "emptyState"
      );


    const resultCount =
      document.getElementById(
        "resultCount"
      );


    let featuredOnly = false;



    const publishedStories =
      TALEFORGE_STORIES.filter(
        function(story) {

          return (
            story.status === "published" &&
            story.content
          );

        }
      );



    function addOptions(
      select,
      values
    ) {

      values
        .sort()
        .forEach(
          function(value) {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              value;

            option.textContent =
              value;

            select.appendChild(
              option
            );

          }
        );

    }



    const genres =
      Array.from(
        new Set(
          publishedStories.map(
            function(story) {

              return story.genre;

            }
          )
        )
      );


    const moods =
      Array.from(
        new Set(
          publishedStories.map(
            function(story) {

              return story.mood;

            }
          )
        )
      );


    const intensities =
      Array.from(
        new Set(
          publishedStories.map(
            function(story) {

              return story.intensity;

            }
          )
        )
      );



    addOptions(
      genreFilter,
      genres
    );


    addOptions(
      moodFilter,
      moods
    );


    addOptions(
      intensityFilter,
      intensities
    );



    function createStoryCard(
      story
    ) {

      const card =
        document.createElement(
          "a"
        );

      card.className =
        "story-card";

      card.href =
        story.storyPage;



      const top =
        document.createElement(
          "div"
        );

      top.className =
        "card-top";



      const genre =
        document.createElement(
          "div"
        );

      genre.className =
        "genre";

      genre.textContent =
        story.genre;



      top.appendChild(
        genre
      );



      if (story.featured) {

        const badge =
          document.createElement(
            "div"
          );

        badge.className =
          "featured";

        badge.textContent =
          "Featured";

        top.appendChild(
          badge
        );

      }



      const title =
        document.createElement(
          "h2"
        );

      title.textContent =
        story.title;



      const subtitle =
        document.createElement(
          "div"
        );

      subtitle.className =
        "subtitle";

      subtitle.textContent =
        story.subtitle;



      const summary =
        document.createElement(
          "p"
        );

      summary.className =
        "summary";

      summary.textContent =
        story.summary;



      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "card-meta";



      const readingTime =
        document.createElement(
          "span"
        );

      readingTime.className =
        "meta-pill";

      readingTime.textContent =
        story.readingTime +
        " min read";



      const mood =
        document.createElement(
          "span"
        );

      mood.className =
        "meta-pill";

      mood.textContent =
        story.mood;



      const intensity =
        document.createElement(
          "span"
        );

      intensity.className =
        "meta-pill";

      intensity.textContent =
        story.intensity;



      meta.appendChild(
        readingTime
      );

      meta.appendChild(
        mood
      );

      meta.appendChild(
        intensity
      );



      const read =
        document.createElement(
          "div"
        );

      read.className =
        "read-link";

      read.textContent =
        "Read story →";



      card.appendChild(
        top
      );

      card.appendChild(
        title
      );

      card.appendChild(
        subtitle
      );

      card.appendChild(
        summary
      );

      card.appendChild(
        meta
      );

      card.appendChild(
        read
      );


      return card;

    }



    function renderStories() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      const selectedGenre =
        genreFilter.value;


      const selectedMood =
        moodFilter.value;


      const selectedIntensity =
        intensityFilter.value;


      const sort =
        sortFilter.value;



      let results =
        publishedStories.filter(
          function(story) {

            const searchable =
              (
                story.title +
                " " +
                story.genre +
                " " +
                story.mood +
                " " +
                story.subtitle +
                " " +
                story.summary
              ).toLowerCase();


            const matchesSearch =
              !query ||
              searchable.includes(
                query
              );


            const matchesGenre =
              !selectedGenre ||
              story.genre ===
                selectedGenre;


            const matchesMood =
              !selectedMood ||
              story.mood ===
                selectedMood;


            const matchesIntensity =
              !selectedIntensity ||
              story.intensity ===
                selectedIntensity;


            const matchesFeatured =
              !featuredOnly ||
              story.featured === true;


            return (
              matchesSearch &&
              matchesGenre &&
              matchesMood &&
              matchesIntensity &&
              matchesFeatured
            );

          }
        );



      results.sort(
        function(a, b) {

          if (sort === "title") {

            return a.title.localeCompare(
              b.title
            );

          }


          if (sort === "shortest") {

            return (
              a.readingTime -
              b.readingTime
            );

          }


          if (sort === "longest") {

            return (
              b.readingTime -
              a.readingTime
            );

          }


          return (
            new Date(b.publishedAt) -
            new Date(a.publishedAt)
          );

        }
      );



      storyGrid.innerHTML =
        "";


      resultCount.textContent =
        results.length +
        (
          results.length === 1
            ? " story"
            : " stories"
        ) +
        " found";



      if (
        results.length === 0
      ) {

        emptyState.style.display =
          "block";

        return;

      }



      emptyState.style.display =
        "none";



      results.forEach(
        function(story) {

          storyGrid.appendChild(
            createStoryCard(
              story
            )
          );

        }
      );

    }



    featuredToggle.addEventListener(
      "click",
      function() {

        featuredOnly =
          !featuredOnly;


        featuredToggle.classList.toggle(
          "active",
          featuredOnly
        );


        renderStories();

      }
    );



    searchInput.addEventListener(
      "input",
      renderStories
    );


    genreFilter.addEventListener(
      "change",
      renderStories
    );


    moodFilter.addEventListener(
      "change",
      renderStories
    );


    intensityFilter.addEventListener(
      "change",
      renderStories
    );


    sortFilter.addEventListener(
      "change",
      renderStories
    );



    const parameters =
      new URLSearchParams(
        window.location.search
      );


    const initialGenre =
      parameters.get(
        "genre"
      );


    if (
      initialGenre &&
      genres.includes(
        initialGenre
      )
    ) {

      genreFilter.value =
        initialGenre;

    }



    renderStories();


  </script>


</body>

            </html>
