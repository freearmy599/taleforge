<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Explore — TaleForge</title><meta name="description" content="Explore live TaleForge series and published chapters.">
<style>
:root{--bg:#080b10;--surface:#11161e;--border:#25303c;--text:#f3f6f9;--muted:#9ba7b5;--accent:#67e8f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:10;padding:17px 24px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(8,11,16,.88);backdrop-filter:blur(18px)}nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between}.brand{font-size:21px;font-weight:850}.brand span{color:var(--accent)}.back{color:var(--muted);font-size:14px}.hero,.controls,.library{max-width:1180px;margin:auto;padding-left:24px;padding-right:24px}.hero{padding-top:75px;padding-bottom:35px}.eyebrow,.genre{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.hero h1{font:700 clamp(45px,7vw,72px)/1 Georgia,serif;letter-spacing:-3px;margin:17px 0 10px}.hero p{color:var(--muted);line-height:1.6}.controls{padding-bottom:30px}.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.input,.select{height:44px;width:100%;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:0 13px;outline:none}.library{padding-bottom:100px}.count{color:var(--muted);font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:block;min-height:220px;padding:23px;border:1px solid var(--border);border-radius:19px;background:linear-gradient(145deg,#151c25,#10151d);transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(103,232,249,.35)}.card h2{font:700 27px/1.15 Georgia,serif;margin:13px 0 8px}.card p{color:var(--muted);font-size:14px;line-height:1.6}.meta{margin-top:20px;color:#7f8b9a;font-size:12px}.empty{padding:40px;border:1px dashed var(--border);border-radius:16px;color:var(--muted)}footer{padding:35px 24px;border-top:1px solid var(--border);text-align:center;color:#697382;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.bar{grid-template-columns:1fr}}@media(max-width:560px){.hero,.controls,.library{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><nav><a class="brand" href="index.html">Tale<span>Forge</span></a><a class="back" href="index.html">Home</a></nav></header>
<section class="hero"><div class="eyebrow">Live Library</div><h1>Find your next world.</h1><p>Browse the series and chapters currently published on TaleForge.</p></section>
<section class="controls"><div class="bar"><input id="search" class="input" placeholder="Search series..." autocomplete="off"><select id="genre" class="select"><option value="">All genres</option></select><select id="sort" class="select"><option value="newest">Newest</option><option value="title">Title A–Z</option></select></div></section>
<main class="library"><div id="count" class="count">Loading...</div><div id="grid" class="grid"><div class="empty">Connecting to the live library...</div></div></main>
<footer>© 2026 TaleForge — Short stories. Infinite worlds.</footer>
<script type="module">
import "./supabase-client.js";
const supabase=window.taleForgeSupabase,search=document.getElementById("search"),genre=document.getElementById("genre"),sort=document.getElementById("sort"),grid=document.getElementById("grid"),count=document.getElementById("count");
const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
let series=[];
async function load(){
 try{
  const {data,error}=await supabase.from("series").select("id,title,slug,subtitle,description,status,age_rating,mood,intensity,published_at,genres(name)").in("status",["ongoing","completed"]).order("published_at",{ascending:false});
  if(error)throw error;series=data||[];
  const {data:chapters,error:ce}=await supabase.from("chapters").select("id,series_id,chapter_number,title,published_at").eq("status","published").order("published_at",{ascending:false});
  if(ce)throw ce;
  const counts=new Map();(chapters||[]).forEach(c=>counts.set(c.series_id,(counts.get(c.series_id)||0)+1));
  series=series.map(s=>({...s,publishedChapters:counts.get(s.id)||0}));
  [...new Set(series.map(s=>s.genres?.name).filter(Boolean))].sort().forEach(g=>genre.insertAdjacentHTML("beforeend",'<option value="'+esc(g)+'">'+esc(g)+'</option>'));
  render();
 }catch(e){console.error(e);grid.innerHTML='<div class="empty">The live library could not be loaded.</div>';count.textContent="Library unavailable"}
}
function render(){
 const q=search.value.trim().toLowerCase(),g=genre.value;
 let list=series.filter(s=>(!q||(s.title||"").toLowerCase().includes(q)||(s.subtitle||"").toLowerCase().includes(q)||(s.description||"").toLowerCase().includes(q))&&(!g||s.genres?.name===g));
 if(sort.value==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));else list.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));
 count.textContent=list.length+" "+(list.length===1?"series":"series")+" found";
 grid.innerHTML=list.length?list.map(s=>'<a class="card" href="series.html?id='+encodeURIComponent(s.id)+'"><div class="genre">'+esc(s.genres?.name||"Fiction")+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.subtitle||s.description||"Discover this world on TaleForge.")+'</p><div class="meta">'+esc(s.status)+' · '+esc(s.publishedChapters)+' published chapters'+(s.age_rating?" · "+esc(s.age_rating):"")+'</div></a>').join(""):'<div class="empty">No series match your search.</div>';
}
search.addEventListener("input",render);genre.addEventListener("change",render);sort.addEventListener("change",render);load();
</script>
</body>
</html>
