<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore — TaleForge</title><meta name="description" content="Explore original serialized fiction on TaleForge.">
<style>
:root{--bg:#090a0c;--panel:#111316;--line:rgba(255,255,255,.09);--text:#f5f1e8;--muted:#a7a39b;--gold:#d6b36a;--gold2:#f0d99c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:76px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(9,10,12,.8);backdrop-filter:blur(20px)}.navin{max-width:1240px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{font:25px Georgia,serif}.brand b{color:var(--gold);font-weight:600}.links{display:flex;gap:25px;color:#a7a39b;font-size:14px}.links a:hover{color:var(--text)}main{max-width:1240px;margin:auto;padding:70px 24px 100px}.kicker{font-size:10px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-weight:800}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:42px}.hero h1{font:500 clamp(52px,7vw,78px)/.95 Georgia,serif;letter-spacing:-3px;margin:14px 0}.hero p{color:var(--muted);max-width:560px;line-height:1.7}.searchbox{width:min(380px,100%);background:#111316;border:1px solid var(--line);padding:15px 16px;color:var(--text);outline:none;border-radius:3px}.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:25px;display:flex;gap:10px;flex-wrap:wrap}.select{background:transparent;color:#b4b0a8;border:1px solid var(--line);padding:10px 12px;border-radius:3px}.count{color:#77736c;font-size:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:250px;padding:26px;border:1px solid var(--line);background:linear-gradient(145deg,#141619,#0e1012);display:flex;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(214,179,106,.4)}.genre{color:var(--gold);font-size:10px;letter-spacing:.17em;text-transform:uppercase;font-weight:800}.card h2{font:500 29px/1.08 Georgia,serif;margin:16px 0 10px}.card p{color:#97938b;font-size:14px;line-height:1.65}.meta{margin-top:auto;color:#77736c;font-size:12px}.empty{padding:35px;border:1px dashed var(--line);color:var(--muted)}footer{border-top:1px solid var(--line);padding:35px;text-align:center;color:#6e6a64;font-size:12px}@media(max-width:800px){.hero{display:block}.searchbox{margin-top:25px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:50px 17px 80px}.grid{grid-template-columns:1fr}.hero h1{font-size:51px}.links a:nth-child(2){display:none}}
</style></head>
<body><header class="nav"><div class="navin"><a class="brand" href="index.html">Tale<b>Forge</b></a><nav class="links"><a href="index.html">Home</a><a href="stories.html">Explore</a></nav></div></header>
<main><section class="hero"><div><div class="kicker">The living library</div><h1>Find your next world.</h1><p>Browse published series, discover a new genre, and open a story directly into its chapters.</p></div><input id="search" class="searchbox" placeholder="Search titles, themes, descriptions…" autocomplete="off"></section>
<div class="filters"><select id="genre" class="select"><option value="">All genres</option></select><select id="sort" class="select"><option value="newest">Recently published</option><option value="title">Title A–Z</option></select></div>
<div id="count" class="count">Loading library…</div><div id="grid" class="grid"><div class="empty">Connecting to TaleForge…</div></div></main><footer>© 2026 TaleForge · Short stories. Infinite worlds.</footer>
<script type="module">import "./supabase-client.js";const supabase=window.taleForgeSupabase,search=document.getElementById("search"),genre=document.getElementById("genre"),sort=document.getElementById("sort"),grid=document.getElementById("grid"),count=document.getElementById("count");const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};let series=[];
async function load(){try{const {data,error}=await supabase.from("series").select("id,title,slug,subtitle,description,status,age_rating,mood,intensity,published_at,genres(name)").in("status",["ongoing","completed"]).order("published_at",{ascending:false});if(error)throw error;series=data||[];const {data:chs,error:ce}=await supabase.from("chapters").select("series_id").eq("status","published");if(ce)throw ce;const counts=new Map();(chs||[]).forEach(c=>counts.set(c.series_id,(counts.get(c.series_id)||0)+1));series=series.map(s=>({...s,publishedChapters:counts.get(s.id)||0}));[...new Set(series.map(s=>s.genres?.name).filter(Boolean))].sort().forEach(g=>genre.insertAdjacentHTML("beforeend",'<option value="'+esc(g)+'">'+esc(g)+"</option>"));render()}catch(e){console.error(e);count.textContent="Library unavailable";grid.innerHTML='<div class="empty">The live library could not be loaded.</div>'}}
function render(){const q=search.value.trim().toLowerCase(),g=genre.value;let list=series.filter(s=>(!q||[s.title,s.subtitle,s.description,s.mood].some(v=>(v||"").toLowerCase().includes(q)))&&(!g||s.genres?.name===g));if(sort.value==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));else list.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));count.textContent=list.length+" "+(list.length===1?"series":"series")+" available";grid.innerHTML=list.length?list.map(s=>'<a class="card" href="series.html?id='+encodeURIComponent(s.id)+'"><div class="genre">'+esc(s.genres?.name||"Fiction")+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.subtitle||s.description||"Discover this world.")+'</p><div class="meta">'+esc(s.status)+' · '+esc(s.publishedChapters)+' published chapters</div></a>').join(""):'<div class="empty">No worlds match that search.</div>'}
search.addEventListener("input",render);genre.addEventListener("change",render);sort.addEventListener("change",render);load();</script></body></html>
