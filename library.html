ground:none;border:0;color:#77736c;cursor:pointer;font-size:11px;padding:0;margin-top:10px}.remove:hover{color:#d6b36a}@media(max-width:700px){main{padding:40px 17px 90px}.grid{grid-template-columns:1fr}.head h2{font-size:27px}.navin{padding:0 17px}}
<style>
:root{--bg:#090a0c;--panel:#111316;--line:rgba(255,255,255,.09);--text:#f5f1e8;--muted:#9b978f;--gold:#d6b36a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(214,179,106,.11),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}
.nav{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{max-width:1240px;width:100%;margin:auto;padding:0 24px;display:flex;align-items:center}.brand{font:25px Georgia,serif;margin-right:auto}.brand b{color:var(--gold);font-weight:600}.back{color:var(--muted);font-size:13px}
main{max-width:1240px;margin:auto;padding:55px 24px 100px}.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800}.hero{padding-bottom:38px;border-bottom:1px solid var(--line)}h1{font:500 clamp(48px,7vw,76px)/.95 Georgia,serif;letter-spacing:-3px;margin:15px 0}.hero p{color:var(--muted);max-width:650px;line-height:1.7}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{position:relative;min-height:245px;border:1px solid var(--line);background:linear-gradient(145deg,#141619,#0e1012);display:grid;grid-template-columns:92px 1fr;gap:17px;padding:16px;transition:.2s}.card:hover{border-color:rgba(214,179,106,.45);transform:translateY(-2px);box-shadow:0 16px 35px rgba(0,0,0,.25)}

</style></head><body><header class="nav"><div class="navin"><a class="brand" href="index.html">Tale<b>Forge</b></a><nav style="display:flex;gap:18px;font-size:13px;color:#9b978f"><a href="stories.html">Explore</a><a href="notifications.html">Updates</a></nav></div></header><main><section class="hero"><div class="kicker">Your private shelf</div><h1>Library.</h1><p>Keep the worlds you care about close. Follow stories, return to saved chapters, and see where you have been reading.</p><div class="tabs"><button class="tab active" data-tab="following">Following</button><button class="tab" data-tab="bookmarks">Bookmarks</button><button class="tab" data-tab="history">History</button></div></section><section class="section"><div class="head"><h2 id="heading">Following</h2><span id="count" class="count"></span></div><div id="grid" class="grid"><div class="empty">Loading your library…</div></div></section><section class="section" id="recommendSection" style="display:none"><div class="head"><h2>Because you follow</h2><span class="count">Live discovery</span></div><div id="recommend" class="grid"></div></section></main><footer style="text-align:center;padding:25px;color:#77736c;font-size:11px"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer><script type="module">
import "./supabase-client.js";import "./reading-progress.js";
const supabase=window.taleForgeSupabase,grid=document.getElementById("grid"),heading=document.getElementById("heading"),count=document.getElementById("count"),recSection=document.getElementById("recommendSection"),rec=document.getElementById("recommend"),esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
let tab="following",series=[];
async function loadSeries(){const {data,error}=await supabase.from("series").select("id,title,subtitle,description,status,published_at,cover_image,genres(name)").in("status",["ongoing","completed"]);if(!error)series=data||[]}
function seriesMap(){return new Map(series.map(s=>[s.id,s]))}
function cardCover(s){return s?.cover_image?'<div class="cover"><img loading="lazy" src="'+esc(s.cover_image)+'" alt="'+esc(s.title||"Story")+' cover"></div>':'<div class="cover"></div>'}
function render(){const l=window.taleForgeProgress.library(),m=seriesMap(),progress=window.taleForgeProgress.allProgress(),items=tab==="following"?Object.values(l.follows):tab==="bookmarks"?Object.values(l.bookmarks):l.history;heading.textContent=tab[0].toUpperCase()+tab.slice(1);count.textContent=items.length+" saved";
if(!items.length){grid.innerHTML='<div class="empty">Nothing here yet. Open a story and start reading to build your library.</div>';return}
if(tab==="following")grid.innerHTML=items.map(x=>{const s=m.get(x.seriesId),p=progress.find(v=>v.seriesId===x.seriesId),pct=Math.max(0,Math.min(100,Number(p?.progress||p?.progressPercent||0)));return '<div class="card">'+cardCover(s)+'<div class="info"><div class="kicker">'+esc(x.genre||s?.genres?.name||"Fiction")+'</div><h3>'+esc(s?.title||x.seriesTitle||"Story")+'</h3><p class="desc">'+esc(s?.subtitle||s?.description||"A story worth returning to.")+'</p><div class="meta">'+(pct>0?Math.round(pct)+"% read":"Not started")+'</div></div><div class="progress" style="--progress:'+pct+'%"><i></i></div><div class="progress-label">'+(pct>0?"Continue where you left off":"Start reading")+'</div><a class="remove" href="series.html?id='+encodeURIComponent(x.seriesId)+'">Open story →</a><button class="remove" data-remove="'+esc(x.seriesId)+'" type="button">Unfollow</button></div>'}).join("");
else if(tab==="bookmarks")grid.innerHTML=items.map(x=>{const s=m.get(x.seriesId);return '<div class="card">'+cardCover(s)+'<div class="info"><div class="kicker">Chapter '+esc(x.chapterNumber)+'</div><h3>'+esc(s?.title||x.seriesTitle||"Story")+'</h3><p class="desc">'+esc(x.chapterTitle||"Saved chapter")+'</p><div class="meta">Bookmarked</div></div><a class="remove" href="chapter.html?id='+encodeURIComponent(x.chapterId)+'">Open chapter →</a><button class="remove" data-bookmark="'+esc(x.chapterId)+'" type="button">Remove bookmark</button></div>'}).join("");
else grid.innerHTML=items.map(x=>{const s=m.get(x.seriesId);return '<div class="card">'+cardCover(s)+'<div class="info"><div class="kicker">Chapter '+esc(x.chapterNumber)+'</div><h3>'+esc(s?.title||x.seriesTitle||"Story")+'</h3><p class="desc">'+esc(x.chapterTitle||"Reading history")+'</p><div class="meta">Read '+new Date(x.updatedAt).toLocaleDateString()+'</div></div><a class="remove" href="chapter.html?id='+encodeURIComponent(x.chapterId)+'">Continue reading →</a></div>'}).join("");
grid.querySelectorAll("[data-remove]").forEach(b=>b.onclick=e=>{e.preventDefault();window.taleForgeProgress.unfollowSeries(b.dataset.remove);render();renderRecommendations()});grid.querySelectorAll("[data-bookmark]").forEach(b=>b.onclick=e=>{e.preventDefault();window.taleForgeProgress.removeBookmark(b.dataset.bookmark);render()})}
function renderRecommendations(){const follows=window.taleForgeProgress.allFollows();if(!follows.length||!series.length){recSection.style.display="none";return}const genres=new Set(follows.map(x=>x.genre));const sameGenre=series.filter(s=>!follows.some(f=>f.seriesId===s.id)&&genres.has(s.genres?.name));const fallback=series.filter(s=>!follows.some(f=>f.seriesId===s.id));const picks=[...sameGenre,...fallback.filter(s=>!sameGenre.some(g=>g.id===s.id))].slice(0,3);if(!picks.length){recSection.style.display="none";return}recSection.style.display="block";rec.innerHTML=picks.map(s=>'<a class="card" href="series.html?id='+encodeURIComponent(s.id)+'">'+cardCover(s)+'<div class="info"><div class="kicker">'+esc(s.genres?.name||"Fiction")+'</div><h3>'+esc(s.title)+'</h3><p class="desc">'+esc(s.subtitle||s.description||"A world you may enjoy.")+'</p><div class="meta">Because you follow '+esc(s.genres?.name||"this genre")+' →</div></div></a>').join("")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;render()});await loadSeries();render();renderRecommendations();
</script></body></html>
