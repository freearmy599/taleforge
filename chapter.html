<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading — TaleForge</title><style>
:root{--bg:#f2eee5;--ink:#24211c;--muted:#777169;--line:rgba(36,33,28,.15);--gold:#a77d35;--night:#101113}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:66px;position:sticky;top:0;z-index:30;background:rgba(242,238,229,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.navin{height:100%;max-width:1100px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font:22px Georgia,serif}.brand b{color:var(--gold);font-weight:600}.back{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.32);font-size:13px;color:var(--ink);font-weight:700;transition:.2s}.back:hover{border-color:rgba(167,125,53,.55);transform:translateY(-1px)}main{max-width:760px;margin:auto;padding:72px 22px 110px}.series{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:34px;padding:10px 14px;border:1px solid rgba(167,125,53,.35);border-radius:999px;background:rgba(167,125,53,.06);transition:.2s}.series:hover{background:rgba(167,125,53,.12);border-color:rgba(167,125,53,.55);transform:translateX(-2px)}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:800}.title{font:500 clamp(44px,7vw,68px)/.98 Georgia,serif;letter-spacing:-2.5px;margin:12px 0}.subtitle{font:22px/1.55 Georgia,serif;color:#716b62}.meta{display:flex;gap:15px;color:#8b847a;font-size:11px;margin-top:22px}.rule{height:1px;background:var(--line);margin:50px 0}.reader{font:20px/2 Georgia,serif;color:#2c2924}.reader p{margin:0 0 1.55em}.reader p:first-child:first-letter{float:left;font-size:4em;line-height:.78;padding:.08em .1em 0 0;color:var(--gold)}.controls{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;gap:7px}.control{width:42px;height:42px;border:1px solid var(--line);background:rgba(242,238,229,.9);color:var(--ink);font-weight:800;cursor:pointer;border-radius:50%}.control:hover{background:#fff}.progress{position:fixed;top:65px;left:0;height:2px;background:var(--gold);width:0;z-index:50}.navigation{margin-top:80px;border-top:1px solid var(--line);padding-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.navcard{display:block;min-height:105px;padding:20px;border:1px solid rgba(36,33,28,.18);border-radius:12px;background:rgba(255,255,255,.34);box-shadow:0 8px 24px rgba(36,33,28,.04);transition:.2s}.navcard:hover{border-color:rgba(167,125,53,.55);background:rgba(255,255,255,.58);transform:translateY(-2px)}.navcard .label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:9px}.navcard .ntitle{font:18px/1.35 Georgia,serif;color:var(--ink)}.center{grid-column:1/-1;text-align:center;margin-top:8px}.center a{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1px solid rgba(167,125,53,.42);border-radius:999px;background:rgba(167,125,53,.07);color:var(--gold);font-size:13px;font-weight:700;transition:.2s}.center a:hover{background:rgba(167,125,53,.13);transform:translateY(-1px)}.loading,.error{text-align:center;padding:100px 20px;color:var(--muted)}body.night{--bg:#111214;--ink:#e7e1d6;--muted:#aaa39a;--line:rgba(255,255,255,.13);--gold:#d1a758}.night .nav,.night .control{background:rgba(17,18,20,.9)}.night .reader{color:#ded8ce}@media(max-width:600px){main{padding:52px 18px 90px}.reader{font-size:18px;line-height:1.9}.title{font-size:45px}.navigation{grid-template-columns:1fr}.meta{flex-wrap:wrap}.controls{right:12px;bottom:12px}}
</style></head><body><header class="nav"><div class="navin"><a class="brand" href="index.html">Tale<b>Forge</b></a><a id="back" class="back" href="stories.html">Explore</a></div></header><div class="progress" id="progress"></div><main id="app"><div class="loading">Opening chapter…</div></main><footer style="text-align:center;padding:20px;color:var(--muted);font-size:11px"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer><div class="controls"><button class="control" id="minus" aria-label="Smaller text">A−</button><button class="control" id="plus" aria-label="Larger text">A+</button><button class="control" id="theme" aria-label="Toggle reading theme">◐</button><button class="control" id="bookmark" aria-label="Bookmark chapter">☆</button></div>
<script type="module">import "./supabase-client.js";import "./reading-progress.js";const supabase=window.taleForgeSupabase,app=document.getElementById("app"),esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};const id=new URLSearchParams(location.search).get("id");let size=20;let currentChapter=null,currentSeries=null;function content(v){return (v||"").trim().split(/\n\s*\n/).map(p=>'<p>'+esc(p).replace(/\n/g,"<br>")+"</p>").join("")}
async function load(){if(!id)return error("Chapter not found","No chapter was specified.");const {data:c,error:e}=await supabase.from("chapters").select("id,series_id,chapter_number,title,subtitle,content,word_count,reading_time,published_at,series(id,title,status)").eq("id",id).eq("status","published").single();if(e||!c||!c.series||!["ongoing","completed"].includes(c.series.status))return error("Chapter unavailable","This chapter has not been published for public reading.");const {data:all}=await supabase.from("chapters").select("id,chapter_number,title").eq("series_id",c.series.id).eq("status","published").order("chapter_number",{ascending:true});render(c,c.series,all||[])}
function restoreProgress(){const p=window.taleForgeProgress?.getProgress(currentSeries?.id);if(!p||p.chapterId!==currentChapter?.id)return;const target=Math.max(0,Math.min(100,p.percent||0));if(target>2)window.scrollTo({top:(document.documentElement.scrollHeight-innerHeight)*(target/100),behavior:"instant"})}
function updateBookmark(){const b=document.getElementById("bookmark");if(!b||!currentChapter)return;b.textContent=window.taleForgeProgress.isBookmarked(currentChapter.id)?"★":"☆";b.onclick=()=>{if(window.taleForgeProgress.isBookmarked(currentChapter.id))window.taleForgeProgress.removeBookmark(currentChapter.id);else window.taleForgeProgress.bookmarkChapter({chapterId:currentChapter.id,seriesId:currentSeries.id,seriesTitle:currentSeries.title,chapterNumber:currentChapter.chapter_number,chapterTitle:currentChapter.title});updateBookmark()};updateBookmark()}
function saveCurrentProgress(){if(!currentChapter||!currentSeries)return;const h=document.documentElement.scrollHeight-innerHeight;const percent=h>0?Math.round((scrollY/h)*100):0;window.taleForgeProgress?.saveProgress({seriesId:currentSeries.id,seriesTitle:currentSeries.title,chapterId:currentChapter.id,chapterNumber:currentChapter.chapter_number,chapterTitle:currentChapter.title,percent:Math.max(0,Math.min(100,percent))});window.taleForgeProgress.track("reading_progress",{seriesId:currentSeries.id,chapterId:currentChapter.id,progressPercent:percent});if(percent>=95)window.taleForgeProgress.track("chapter_complete",{seriesId:currentSeries.id,chapterId:currentChapter.id})}
function setChapterSeo(c,s){document.title=c.title+" — "+s.title+" | TaleForge";const desc=(c.subtitle||c.title+" — Chapter "+c.chapter_number+" of "+s.title+" on TaleForge.").replace(/\\s+/g," ").slice(0,160);let m=document.querySelector('meta[name="description"]');if(!m){m=document.createElement("meta");m.name="description";document.head.appendChild(m)}m.content=desc;let r=document.querySelector('meta[name="robots"]');if(!r){r=document.createElement("meta");r.name="robots";document.head.appendChild(r)}r.content="index,follow,max-image-preview:large";let canon=document.querySelector('link[rel="canonical"]');if(!canon){canon=document.createElement("link");canon.rel="canonical";document.head.appendChild(canon)}canon.href=location.href;let old=document.getElementById("chapter-jsonld");if(old)old.remove();const ld=document.createElement("script");ld.id="chapter-jsonld";ld.type="application/ld+json";ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article","headline":c.title,"description":desc,"url":location.href,"datePublished":c.published_at,"isPartOf":{"@type":"CreativeWork","name":s.title},"publisher":{"@type":"Organization","name":"TaleForge"}});document.head.appendChild(ld)}
function render(c,s,all){currentChapter=c;currentSeries=s;window.taleForgeProgress.track("chapter_start",{seriesId:s.id,chapterId:c.id});setChapterSeo(c,s);const i=all.findIndex(x=>x.id===c.id),prev=i>0?all[i-1]:null,next=i>=0&&i<all.length-1?all[i+1]:null;app.innerHTML='<a class="series" href="series.html?id='+encodeURIComponent(s.id)+'">← '+esc(s.title)+'</a><div class="eyebrow">Chapter '+esc(c.chapter_number)+'</div><h1 class="title">'+esc(c.title)+'</h1>'+(c.subtitle?'<div class="subtitle">'+esc(c.subtitle)+'</div>':"")+'<div class="meta">'+(c.word_count?'<span>'+esc(c.word_count)+' words</span>':"")+(c.reading_time?'<span>'+esc(c.reading_time)+' min read</span>':"")+'<span>Published</span></div><div class="rule"></div><article class="reader" id="reader">'+content(c.content)+'</article><section class="navigation">'+(prev?'<a class="navcard" href="chapter.html?id='+encodeURIComponent(prev.id)+'"><span class="label">Previous chapter</span><span class="ntitle">Chapter '+esc(prev.chapter_number)+' · '+esc(prev.title)+'</span></a>':'<div class="navcard" style="opacity:.45"><span class="label">Previous</span><span class="ntitle">Beginning of series</span></div>')+(next?'<a class="navcard" href="chapter.html?id='+encodeURIComponent(next.id)+'"><span class="label">Next chapter</span><span class="ntitle">Chapter '+esc(next.chapter_number)+' · '+esc(next.title)+'</span></a>':'<div class="navcard" style="opacity:.45"><span class="label">Next</span><span class="ntitle">Latest published chapter</span></div>')+'<div class="center"><a href="series.html?id='+encodeURIComponent(s.id)+'">View all chapters</a></div></section>';updateBookmark();restoreAfterRender()}
function restoreAfterRender(){requestAnimationFrame(()=>setTimeout(()=>{restoreProgress();const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("progress").style.width=(h>0?(scrollY/h)*100:0)+"%"},40))}
function error(t,m){app.innerHTML='<div class="error"><h2 style="font:500 34px Georgia,serif;color:var(--ink)">'+esc(t)+'</h2><p>'+esc(m)+'</p><a href="stories.html" style="color:var(--gold)">Back to Explore</a></div>'}
updateBookmark();document.getElementById("minus").onclick=()=>{size=Math.max(16,size-1);document.getElementById("reader").style.fontSize=size+"px"};document.getElementById("plus").onclick=()=>{size=Math.min(26,size+1);document.getElementById("reader").style.fontSize=size+"px"};document.getElementById("theme").onclick=()=>document.body.classList.toggle("night");let saveTimer=0;addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("progress").style.width=(h>0?(scrollY/h)*100:0)+"%";if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=0;saveCurrentProgress()},1000)});addEventListener("beforeunload",()=>{if(saveTimer)clearTimeout(saveTimer);saveCurrentProgress()});addEventListener("pagehide",()=>{if(saveTimer)clearTimeout(saveTimer);saveCurrentProgress()});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveCurrentProgress()});load();</script></body></html>
