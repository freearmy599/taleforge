<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chapter | TaleForge</title>
  <meta
    name="description"
    content="Read serialized fiction chapters on TaleForge."
  />

  <style>
    :root {
      --bg: #0b0d12;
      --panel: #11151d;
      --panel-soft: #151a23;
      --border: rgba(255,255,255,0.08);
      --text: #f2f4f8;
      --muted: #9aa4b2;
      --accent: #67e8f9;
      --accent-soft: rgba(103,232,249,0.12);
      --max: 850px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(103,232,249,0.07), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(11,13,18,0.82);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .back-link {
      color: var(--muted);
      font-size: 14px;
    }

    .back-link:hover {
      color: var(--text);
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 70px 22px 100px;
    }

    .series-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-size: 14px;
      margin-bottom: 22px;
    }

    .series-link:hover {
      text-decoration: underline;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.08;
      letter-spacing: -1.8px;
    }

    .subtitle {
      margin-top: 16px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .meta span {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,0.025);
      color: var(--muted);
      font-size: 13px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 48px 0;
    }

    .chapter-content {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.95;
      color: #e7e9ed;
    }

    .chapter-content p {
      margin: 0 0 1.5em;
    }

    .chapter-content p:first-child::first-letter {
      font-size: 3.2em;
      float: left;
      line-height: 0.85;
      padding-right: 8px;
      color: var(--accent);
    }

    .navigation {
      margin-top: 70px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .nav-button {
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      transition: 0.2s ease;
    }

    .nav-button:hover {
      border-color: rgba(103,232,249,0.35);
      background: var(--panel-soft);
      transform: translateY(-1px);
    }

    .nav-button.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .nav-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .nav-title {
      font-size: 15px;
      font-weight: 650;
    }

    .chapter-list {
      margin-top: 16px;
      text-align: center;
    }

    .chapter-list a {
      display: inline-block;
      padding: 12px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    .chapter-list a:hover {
      color: var(--text);
      border-color: rgba(103,232,249,0.35);
    }

    .loading,
    .error {
      text-align: center;
      padding: 100px 20px;
      color: var(--muted);
    }

    .error strong {
      display: block;
      color: var(--text);
      font-size: 22px;
      margin-bottom: 10px;
    }

    @media (max-width: 650px) {
      main {
        padding: 48px 18px 70px;
      }

      h1 {
        font-size: 38px;
      }

      .chapter-content {
        font-size: 18px;
        line-height: 1.85;
      }

      .navigation {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        Tale<span>Forge</span>
      </a>

      <a href="stories.html" class="back-link">
        Explore stories
      </a>
    </div>
  </header>

  <main id="app">
    <div class="loading">
      Loading chapter...
    </div>
  </main>

  <script type="module">
    import "./supabase-client.js";

    const supabase = window.taleForgeSupabase;
    const app = document.getElementById("app");

    const params = new URLSearchParams(window.location.search);
    const chapterId = params.get("id");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatContent(content) {
      if (!content) return "";

      return content
        .trim()
        .split(/\n\s*\n/)
        .map(paragraph => `<p>${escapeHTML(paragraph).replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    async function loadChapter() {
      if (!chapterId) {
        showError(
          "Chapter not found",
          "No chapter ID was provided in the URL."
        );
        return;
      }

      const { data: chapter, error } = await supabase
        .from("chapters")
        .select(`
          id,
          series_id,
          chapter_number,
          title,
          subtitle,
          summary,
          content,
          word_count,
          reading_time,
          published_at,
          series (
            id,
            title,
            slug,
            status
          )
        `)
        .eq("id", chapterId)
        .eq("status", "published")
        .single();

      if (error || !chapter) {
        console.error(error);

        showError(
          "Chapter unavailable",
          "This chapter has not been published yet or could not be found."
        );

        return;
      }

      const series = chapter.series;

      if (!series || !["ongoing", "completed"].includes(series.status)) {
        showError(
          "Series unavailable",
          "This series is not currently available for public reading."
        );

        return;
      }

      await renderChapter(chapter, series);
    }

    async function renderChapter(chapter, series) {

      const { data: chapters, error: chaptersError } = await supabase
        .from("chapters")
        .select(`
          id,
          chapter_number,
          title
        `)
        .eq("series_id", series.id)
        .eq("status", "published")
        .order("chapter_number", { ascending: true });

      if (chaptersError) {
        console.error(chaptersError);
      }

      const publishedChapters = chapters || [];

      const currentIndex = publishedChapters.findIndex(
        item => item.id === chapter.id
      );

      const previousChapter =
        currentIndex > 0
          ? publishedChapters[currentIndex - 1]
          : null;

      const nextChapter =
        currentIndex >= 0 &&
        currentIndex < publishedChapters.length - 1
          ? publishedChapters[currentIndex + 1]
          : null;

      document.title =
        `${chapter.title} — ${series.title} | TaleForge`;

      app.innerHTML = `
        <a
          class="series-link"
          href="series.html?id=${encodeURIComponent(series.id)}"
        >
          ← ${escapeHTML(series.title)}
        </a>

        <div class="eyebrow">
          Chapter ${escapeHTML(chapter.chapter_number)}
        </div>

        <h1>${escapeHTML(chapter.title)}</h1>

        ${
          chapter.subtitle
            ? `<div class="subtitle">${escapeHTML(chapter.subtitle)}</div>`
            : ""
        }

        <div class="meta">
          ${
            chapter.word_count
              ? `<span>${escapeHTML(chapter.word_count)} words</span>`
              : ""
          }

          ${
            chapter.reading_time
              ? `<span>${escapeHTML(chapter.reading_time)} min read</span>`
              : ""
          }

          <span>Published</span>
        </div>

        <div class="divider"></div>

        <article class="chapter-content">
          ${formatContent(chapter.content)}
        </article>

        <div class="navigation">

          ${
            previousChapter
              ? `
                <a
                  class="nav-button"
                  href="chapter.html?id=${encodeURIComponent(previousChapter.id)}"
                >
                  <span class="nav-label">Previous</span>
                  <span class="nav-title">
                    Chapter ${escapeHTML(previousChapter.chapter_number)}:
                    ${escapeHTML(previousChapter.title)}
                  </span>
                </a>
              `
              : `
                <div class="nav-button disabled">
                  <span class="nav-label">Previous</span>
                  <span class="nav-title">Beginning of series</span>
                </div>
              `
          }

          ${
            nextChapter
              ? `
                <a
                  class="nav-button"
                  href="chapter.html?id=${encodeURIComponent(nextChapter.id)}"
                >
                  <span class="nav-label">Next</span>
                  <span class="nav-title">
                    Chapter ${escapeHTML(nextChapter.chapter_number)}:
                    ${escapeHTML(nextChapter.title)}
                  </span>
                </a>
              `
              : `
                <div class="nav-button disabled">
                  <span class="nav-label">Next</span>
                  <span class="nav-title">Latest published chapter</span>
                </div>
              `
          }

        </div>

        <div class="chapter-list">
          <a href="series.html?id=${encodeURIComponent(series.id)}">
            View all chapters
          </a>
        </div>
      `;
    }

    function showError(title, message) {
      app.innerHTML = `
        <div class="error">
          <strong>${escapeHTML(title)}</strong>
          <div>${escapeHTML(message)}</div>
        </div>
      `;
    }

    loadChapter();
  </script>

</body>
  </html>
