<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading — TaleForge</title>
<meta name="description" content="Read serialized fiction on TaleForge.">
<style>
:root{
 --bg:#f4f0e7;--paper:#faf8f3;--ink:#29251f;--muted:#817a70;--line:rgba(41,37,31,.13);
 --gold:#a77d35;--gold2:#c39a52;--shadow:0 18px 55px rgba(45,38,28,.08)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.nav{height:68px;position:sticky;top:0;z-index:50;background:rgba(244,240,231,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.navin{height:100%;max-width:1180px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.brand{font:23px Georgia,serif;margin-right:auto}.brand b{color:var(--gold);font-weight:600}
.navlink{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.28);font-size:12px;font-weight:750}
.navlink:hover{border-color:rgba(167,125,53,.5)}
.progress{position:fixed;top:67px;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0;z-index:60;box-shadow:0 0 12px rgba(167,125,53,.2)}
main{max-width:800px;margin:auto;padding:58px 22px 100px}
.crumb{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin-bottom:30px}
.crumb:hover{text-decoration:underline;text-underline-offset:4px}
.eyebrow{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.2em;font-weight:850}
.title{font:500 clamp(45px,7vw,72px)/.96 Georgia,serif;letter-spacing:-3px;margin:12px 0 12px}
.subtitle{font:21px/1.55 Georgia,serif;color:#70695f;max-width:700px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:21px}
.meta span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#777066;background:rgba(255,255,255,.25);font-size:10px;letter-spacing:.05em}
.rule{height:1px;background:var(--line);margin:45px 0 42px}
.reader-shell{background:var(--paper);border:1px solid rgba(41,37,31,.08);box-shadow:var(--shadow);padding:48px 48px 54px;border-radius:14px}
.reader{font:20px/2 Georgia,serif;color:#302b24;max-width:680px;margin:auto}
.reader p{margin:0 0 1.55em}
.reader p:first-child:first-letter{float:left;font-size:4.1em;line-height:.78;padding:.08em .1em 0 0;color:var(--gold)}
.controls{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;gap:7px;padding:7px;border:1px solid var(--line);background:rgba(244,240,231,.9);backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 12px 35px rgba(45,38,28,.12)}
.control{width:42px;height:42px;border:1px solid var(--line);background:rgba(255,255,255,.4);color:var(--ink);font-weight:800;cursor:pointer;border-radius:11px}
.control:hover{border-color:rgba(167,125,53,.55);background:#fff}
.control.active{color:var(--gold);border-color:rgba(167,125,53,.55)}
.navigation{margin-top:65px;border-top:1px solid var(--line);padding-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.navcard{display:block;min-height:112px;padding:20px;border:1px solid rgba(41,37,31,.14);border-radius:13px;background:rgba(255,255,255,.3);transition:.2s}
.navcard:hover{border-color:rgba(167,125,53,.5);background:rgba(255,255,255,.6);transform:translateY(-2px);box-shadow:0 10px 28px rgba(45,38,28,.06)}
.navcard .label{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:9px}
.navcard .ntitle{font:18px/1.35 Georgia,serif}
.center{grid-column:1/-1;text-align:center;margin-top:8px}
.center a{display:inline-flex;padding:11px 18px;border:1px solid rgba(167,125,53,.42);border-radius:999px;background:rgba(167,125,53,.07);color:var(--gold);font-size:12px;font-weight:800}
.center a:hover{background:rgba(167,125,53,.13)}
.loading,.error{text-align:center;padding:100px 20px;color:var(--muted)}
.footer{border-top:1px solid var(--line);text-align:center;padding:24px;color:var(--muted);font-size:11px}
body.night{--bg:#111214;--paper:#17191c;--ink:#e9e2d6;--muted:#aaa39a;--line:rgba(255,255,255,.13);--gold:#d1a758;--gold2:#e0bd71}
.night .nav,.night .controls{background:rgba(17,18,20,.9)}
.night .reader{color:#e0d9ce}.night .subtitle{color:#aaa39a}.night .navcard{background:rgba(255,255,255,.025)}
@media(max-width:650px){
 main{padding:43px 16px 85px}.reader-shell{padding:30px 20px 34px;border-radius:10px}
 .reader{font-size:18px;line-height:1.9}.title{font-size:46px}.subtitle{font-size:19px}
 .navigation{grid-template-columns:1fr}.center{grid-column:auto}.controls{right:10px;bottom:10px}
 .navlink{padding:8px 10px}.navlink span{display:none}
}
</style>
</head>
<body>
<header class="nav"><div class="navin">
<a class="brand" href="index.html">Tale<b>Forge</b></a>
<a id="back" class="navlink" href="stories.html">← <span>Explore</span></a>
</div></header>
<div class="progress" id="progress"></div>
<main id="app"><div class="loading">Opening chapter…</div></main>
<footer class="footer"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>
<div class="controls" aria-label="Reading controls">
<button class="control" id="minus" aria-label="Smaller text" title="Smaller text">A−</button>
<button class="control" id="plus" aria-label="Larger text" title="Larger text">A+</button>
<button class="control" id="theme" aria-label="Toggle reading theme" title="Reading theme">◐</button>
<button class="control" id="bookmark" aria-label="Bookmark chapter" title="Bookmark chapter">☆</button>
</div>
<script type="module">
import "./taleforge-data.js";
import "./reading-progress.js";
const supabase=window.taleForgeSupabase;
const app=document.getElementById("app");
const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
const id=new URLSearchParams(location.search).get("id");
let size=20,currentChapter=null,currentSeries=null;

function content(v){
 return (v||"").trim().split(/\n\s*\n/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
}
function updateBookmark(){
 const b=document.getElementById("bookmark"); if(!b)return;
 const active=!!(currentChapter&&window.taleForgeProgress?.isBookmarked(currentChapter.id));
 b.textContent=active?"★":"☆";b.classList.toggle("active",active);
 b.setAttribute("aria-pressed",String(active));
 b.onclick=()=>{
  if(!currentChapter)return;
  if(window.taleForgeProgress.isBookmarked(currentChapter.id)){
   window.taleForgeProgress.removeBookmark(currentChapter.id);
   window.taleForgeProgress.track("bookmark_remove",{seriesId:currentSeries?.id,chapterId:currentChapter.id});
  }else{
   window.taleForgeProgress.bookmarkChapter({seriesId:currentSeries?.id,seriesTitle:currentSeries?.title,chapterId:currentChapter.id,chapterNumber:currentChapter.chapter_number,chapterTitle:currentChapter.title});
   window.taleForgeProgress.track("bookmark",{seriesId:currentSeries?.id,chapterId:currentChapter.id});
  }
  updateBookmark();
 };
}
function saveCurrentProgress(){
 if(!currentChapter||!currentSeries)return;
 const max=Math.max(0,Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0)-window.innerHeight);
 const percent=max?Math.max(0,Math.min(100,Math.round((window.scrollY/max)*100))):0;
 window.taleForgeProgress?.saveProgress({seriesId:currentSeries.id,seriesTitle:currentSeries.title,chapterId:currentChapter.id,chapterNumber:currentChapter.chapter_number,chapterTitle:currentChapter.title,percent});
 window.taleForgeProgress?.track("reading_progress",{seriesId:currentSeries.id,chapterId:currentChapter.id,progressPercent:percent});
 if(percent>=95)window.taleForgeProgress?.track("chapter_complete",{seriesId:currentSeries.id,chapterId:currentChapter.id});
}
function updateProgressUi(){
 const max=Math.max(0,Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0)-window.innerHeight);
 const pct=max?Math.max(0,Math.min(100,Math.round((window.scrollY/max)*100))):0;
 document.getElementById("progress").style.width=pct+"%";
}
function restoreProgress(){
 const p=window.taleForgeProgress?.getProgress(currentSeries?.id);
 if(!p||p.chapterId!==currentChapter?.id||Number(p.percent)<=2)return;
 const max=Math.max(0,Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0)-window.innerHeight);
 if(max>0){history.scrollRestoration="manual";window.scrollTo(0,Math.round(max*(Number(p.percent)/100)));}
}
function setSeo(c,s){
 document.title=c.title+" — "+s.title+" | TaleForge";
 const desc=(c.subtitle||c.title+" — Chapter "+c.chapter_number+" of "+s.title+" on TaleForge.").replace(/\s+/g," ").slice(0,160);
 let m=document.querySelector('meta[name="description"]');if(!m){m=document.createElement("meta");m.name="description";document.head.appendChild(m)}m.content=desc;
 let r=document.querySelector('meta[name="robots"]');if(!r){r=document.createElement("meta");r.name="robots";document.head.appendChild(r)}r.content="index,follow,max-image-preview:large";
 let canon=document.querySelector('link[rel="canonical"]');if(!canon){canon=document.createElement("link");canon.rel="canonical";document.head.appendChild(canon)}canon.href=location.href;
 let old=document.getElementById("chapter-jsonld");if(old)old.remove();
 const ld=document.createElement("script");ld.id="chapter-jsonld";ld.type="application/ld+json";
 ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article","headline":c.title,"description":desc,"url":location.href,"datePublished":c.published_at,"isPartOf":{"@type":"CreativeWork","name":s.title},"publisher":{"@type":"Organization","name":"TaleForge"}});
 document.head.appendChild(ld);
}
function render(c,s,all){
 currentChapter=c;currentSeries=s;
 window.taleForgeProgress.track("chapter_start",{seriesId:s.id,chapterId:c.id});
 setSeo(c,s);
 const i=all.findIndex(x=>x.id===c.id),prev=i>0?all[i-1]:null,next=i>=0&&i<all.length-1?all[i+1]:null;
 const seriesHref="series.html?id="+encodeURIComponent(s.id);
 app.innerHTML=
 '<a class="crumb" href="'+seriesHref+'">← '+esc(s.title)+'</a>'+
 '<div class="eyebrow">Chapter '+esc(c.chapter_number)+(all.length?" of "+esc(all.length):"")+'</div>'+
 '<h1 class="title">'+esc(c.title)+'</h1>'+
 (c.subtitle?'<div class="subtitle">'+esc(c.subtitle)+'</div>':"")+
 '<div class="meta">'+(c.word_count?'<span>'+esc(c.word_count)+' words</span>':"")+
 (c.reading_time?'<span>'+esc(c.reading_time)+' min read</span>':"")+
 '<span>Published</span></div>'+
 '<div class="rule"></div>'+
 '<section class="reader-shell"><article class="reader" id="reader">'+content(c.content)+'</article></section>'+
 '<section class="navigation">'+
 (prev?'<a class="navcard" href="chapter.html?id='+encodeURIComponent(prev.id)+'"><span class="label">Previous chapter</span><span class="ntitle">Chapter '+esc(prev.chapter_number)+' · '+esc(prev.title)+'</span></a>':'<div class="navcard" style="opacity:.45"><span class="label">Previous</span><span class="ntitle">Beginning of series</span></div>')+
 (next?'<a class="navcard" href="chapter.html?id='+encodeURIComponent(next.id)+'"><span class="label">Next chapter</span><span class="ntitle">Chapter '+esc(next.chapter_number)+' · '+esc(next.title)+'</span></a>':'<div class="navcard" style="opacity:.45"><span class="label">Next</span><span class="ntitle">Latest published chapter</span></div>')+
 '<div class="center"><a href="'+seriesHref+'">View all chapters</a></div></section>';
 updateBookmark();
 requestAnimationFrame(()=>setTimeout(()=>{restoreProgress();updateProgressUi()},120));
}
async function load(){
 if(!id)return error("Chapter not found","No chapter was specified.");
 try{
  const {data:c,error:e}=await supabase.from("chapters").select("id,series_id,chapter_number,title,subtitle,content,word_count,reading_time,published_at").eq("id",id).eq("status","published").single();
  if(e||!c)throw e||new Error("missing chapter");
  const s=await window.taleForgeData.getSeries(c.series_id);
  if(!s||!["ongoing","completed"].includes(s.status))return error("Chapter unavailable","This chapter has not been published for public reading.");
  const all=await window.taleForgeData.getPublishedChapters(c.series_id);
  render(c,s,all);
 }catch(e){console.error("TaleForge chapter load failed:",e);error("Chapter could not be opened","The chapter request failed. Please refresh and try again.")}
}
function error(t,m){app.innerHTML='<div class="error"><h2 style="font:500 34px Georgia,serif;color:var(--ink)">'+esc(t)+'</h2><p>'+esc(m)+'</p><a href="stories.html" style="color:var(--gold)">Back to Explore</a></div>'}

document.getElementById("minus").onclick=()=>{size=Math.max(16,size-1);const r=document.getElementById("reader");if(r)r.style.fontSize=size+"px"};
document.getElementById("plus").onclick=()=>{size=Math.min(27,size+1);const r=document.getElementById("reader");if(r)r.style.fontSize=size+"px"};
document.getElementById("theme").onclick=()=>document.body.classList.toggle("night");
let saveTimer=0;
addEventListener("scroll",()=>{updateProgressUi();if(!saveTimer)saveTimer=setTimeout(()=>{saveTimer=0;saveCurrentProgress()},250)},{passive:true});
addEventListener("beforeunload",saveCurrentProgress);
addEventListener("pagehide",saveCurrentProgress);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveCurrentProgress()});
document.addEventListener("click",e=>{const link=e.target.closest("a[href]");if(link&&currentChapter)saveCurrentProgress()});
load();
</script>
</body>
</html>
