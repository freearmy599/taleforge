name: Refresh TaleForge sitemap

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/refresh-sitemap.yml"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate sitemap from published Supabase content
        env:
          SUPABASE_URL: https://sxmbnlgufqhcwxcpcsvb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_TE62_J3d3fxN8v-PK3CX6w_prxfHJwC
          SITE_URL: https://taleforge.pages.dev
        run: node scripts/generate-sitemap.mjs
      - name: Commit updated sitemap
        run: |
          git config user.name "TaleForge Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: refresh sitemap"
          git push
