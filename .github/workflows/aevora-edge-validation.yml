name: Aevora Edge source validation

"on":
  push:
    branches:
      - aevora/release-scheduler-hardening
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/release-scheduler/**"
      - "supabase/functions/generation-orchestrator/**"
      - "supabase/functions/review-orchestrator/**"
      - "supabase/functions/release-publisher/**"
      - "supabase/functions/generate-chapter/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - ".github/workflows/aevora-edge-validation.yml"

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check prepared Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check scheduler
        run: deno check supabase/functions/release-scheduler/index.ts
      - name: Type-check publisher
        run: deno check supabase/functions/release-publisher/index.ts
      - name: Type-check chapter generator
        run: deno check supabase/functions/generate-chapter/index.ts
      - name: Type-check generation orchestrator
        run: deno check supabase/functions/generation-orchestrator/index.ts
      - name: Type-check review orchestrator
        run: deno check supabase/functions/review-orchestrator/index.ts
      - name: Run source-contract regression tests
        run: deno test --allow-read=supabase/functions/review-orchestrator/index.ts,supabase/functions/generation-orchestrator/index.ts,supabase/functions/release-scheduler/index.ts,supabase/functions/release-scheduler/published-history.ts,supabase/functions/release-scheduler/review-qualified-outputs.ts,supabase/functions/release-scheduler/weekly-schedule.ts,supabase/functions/release-publisher/index.ts,supabase/functions/release-publisher/publisher-idempotency.ts,supabase/functions/release-publisher/publisher-output-status.ts,supabase/functions/generate-chapter/index.ts,supabase/functions/_shared/internal-api-key.ts,supabase/migrations/20261012183000_aevora_release_scheduler_lease_foundation.sql,supabase/migrations/20261012190000_aevora_atomic_scheduler_lease_fencing.sql supabase/functions/release-scheduler/contract.test.ts
