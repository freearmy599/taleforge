name: Aevora Edge source validation

"on":
  push:
    branches:
      - aevora/release-scheduler-hardening
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/release-scheduler/**"
      - "supabase/functions/generation-orchestrator/**"
      - "supabase/functions/review-orchestrator/**"
      - "supabase/functions/release-publisher/**"
      - "supabase/functions/generate-chapter/**"
      - "supabase/functions/revise-chapter/**"
      - "supabase/functions/publication-sync-processor/**"
      - "supabase/functions/post-publication-canon-sync/**"
      - "supabase/functions/character-continuity/**"
      - "supabase/functions/world-continuity/**"
      - "supabase/functions/blueprint-planner/**"
      - "supabase/functions/story-dna-planner/**"
      - "supabase/functions/arc-planner/**"
      - "supabase/functions/semantic-continuity-extraction/**"
      - "supabase/functions/continuity-review/**"
      - "supabase/functions/originality-review/**"
      - "supabase/functions/safety-review/**"
      - "supabase/functions/publication-review/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/aevora-control-plane-audit/**"
      - "supabase/functions/reader-event-intake/**"
      - "supabase/config.toml"
      - "scripts/aevora-control-plane-audit.mjs"
      - "scripts/aevora-control-plane-audit.contract.test.mjs"
      - ".github/workflows/aevora-control-plane-audit.yml"
      - "supabase/migrations/**"
      - "scripts/aevora-*.mjs"
      - "scripts/aevora-readiness-migration-*.sql"
      - "scripts/test-aevora-readiness-migration.sh"
      - "scripts/aevora-reader-event-integrity-*.sql"
      - "scripts/aevora-reader-event-intake-*.sql"
      - "scripts/aevora-trending-state-assertions.sql"
      - "scripts/aevora-trending-state-fixture.sql"
      - "scripts/test-aevora-trending-state.sh"
      - "scripts/test-aevora-reader-event-integrity.sh"
      - ".github/workflows/aevora-edge-validation.yml"

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check prepared Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check control-plane audit endpoint
        run: deno check supabase/functions/aevora-control-plane-audit/index.ts
      - name: Type-check reader-event intake endpoint
        run: deno check supabase/functions/reader-event-intake/index.ts
      - name: Exercise reader-event intake handler behavior
        run: deno test supabase/functions/reader-event-intake/handler.test.ts
      - name: Type-check scheduler
        run: deno check supabase/functions/release-scheduler/index.ts
      - name: Type-check autonomous series creation runner
        run: deno check supabase/functions/autonomous-series-creation-runner/index.ts
      - name: Type-check publisher
        run: deno check supabase/functions/release-publisher/index.ts
      - name: Type-check chapter generator
        run: deno check supabase/functions/generate-chapter/index.ts
      - name: Type-check revision worker
        run: deno check supabase/functions/revise-chapter/index.ts
      - name: Type-check generation orchestrator
        run: deno check supabase/functions/generation-orchestrator/index.ts
      - name: Type-check review orchestrator
        run: deno check supabase/functions/review-orchestrator/index.ts
      - name: Type-check publication sync processor
        run: deno check supabase/functions/publication-sync-processor/index.ts
      - name: Type-check post-publication canon sync
        run: deno check supabase/functions/post-publication-canon-sync/index.ts
      - name: Type-check character continuity
        run: deno check supabase/functions/character-continuity/index.ts
      - name: Type-check world continuity
        run: deno check supabase/functions/world-continuity/index.ts
      - name: Type-check blueprint planner
        run: deno check supabase/functions/blueprint-planner/index.ts
      - name: Type-check Story DNA planner
        run: deno check supabase/functions/story-dna-planner/index.ts
      - name: Type-check arc planner
        run: deno check supabase/functions/arc-planner/index.ts
      - name: Type-check semantic continuity extraction
        run: deno check supabase/functions/semantic-continuity-extraction/index.ts
      - name: Type-check continuity review
        run: deno check supabase/functions/continuity-review/index.ts
      - name: Type-check originality review
        run: deno check supabase/functions/originality-review/index.ts
      - name: Type-check safety review
        run: deno check supabase/functions/safety-review/index.ts
      - name: Type-check publication review
        run: deno check supabase/functions/publication-review/index.ts
      - name: Run source-contract regression tests
        run: deno test --allow-read=supabase/functions/review-orchestrator/index.ts,supabase/functions/generation-orchestrator/index.ts,supabase/functions/release-scheduler/index.ts,supabase/functions/release-scheduler/published-history.ts,supabase/functions/release-scheduler/review-qualified-outputs.ts,supabase/functions/release-scheduler/weekly-schedule.ts,supabase/functions/release-scheduler/readiness.ts,supabase/functions/release-publisher/index.ts,supabase/functions/release-publisher/publisher-idempotency.ts,supabase/functions/release-publisher/publisher-output-status.ts,supabase/functions/generate-chapter/index.ts,supabase/functions/_shared/internal-api-key.ts,supabase/functions/publication-sync-processor/index.ts,supabase/functions/post-publication-canon-sync/index.ts,supabase/functions/character-continuity/index.ts,supabase/functions/world-continuity/index.ts,supabase/functions/blueprint-planner/index.ts,supabase/functions/story-dna-planner/index.ts,supabase/functions/arc-planner/index.ts,supabase/functions/semantic-continuity-extraction/index.ts,supabase/functions/continuity-review/index.ts,supabase/functions/originality-review/index.ts,supabase/functions/safety-review/index.ts,supabase/functions/publication-review/index.ts,supabase/migrations/20261012183000_aevora_release_scheduler_lease_foundation.sql,supabase/migrations/20261012190000_aevora_atomic_scheduler_lease_fencing.sql,supabase/migrations/20261013090000_aevora_server_only_metrics_outbox_grants.sql,supabase/migrations/20261013103000_lock_internal_narrative_intelligence_tables.sql,supabase/migrations/20261013110000_restrict_internal_invoker_rpc_execution.sql,supabase/migrations/20261014170000_restrict_public_default_privileges.sql,scripts/aevora-control-plane-audit.mjs supabase/functions/release-scheduler/contract.test.ts supabase/functions/release-scheduler/readiness.test.ts
      - name: Run control-plane audit contract tests
        run: node --test scripts/aevora-control-plane-audit.contract.test.mjs
      - name: Run review error-redaction contract tests
        run: node --test scripts/aevora-review-error-redaction-contract.test.mjs
      - name: Run Story DNA planner contract tests
        run: node --test scripts/aevora-story-dna-planner-contract.test.mjs
      - name: Run pipeline redaction contract tests
        run: node --test scripts/aevora-pipeline-redaction-contract.test.mjs
      - name: Run scheduler security contract tests
        run: node --test scripts/aevora-scheduler-security-contract.test.mjs
      - name: Run publisher security contract tests
        run: node --test scripts/aevora-publisher-security-contract.test.mjs
      - name: Run publication authorization stop contract tests
        run: node --test scripts/aevora-publication-authorization-stop-contract.test.mjs
      - name: Run dynamic browser chapter write-boundary tests
        run: node --test scripts/aevora-browser-chapter-write-boundary.test.mjs
      - name: Run browser internal RPC boundary tests
        run: node --test scripts/aevora-browser-internal-rpc-boundary.test.mjs
      - name: Run public trending RPC security contract tests
        run: node --test scripts/aevora-public-trending-rpc-contract.test.mjs
      - name: Run disposable trending rehearsal safety contract tests
        run: node --test scripts/aevora-trending-rehearsal-safety-contract.test.mjs
      - name: Run reader-event intake security contract tests
        run: node --test scripts/aevora-reader-event-intake-contract.test.mjs
      - name: Run reader-event intake endpoint contract tests
        run: node --test scripts/aevora-reader-event-intake-endpoint-contract.test.mjs
      - name: Run release readiness contract tests
        run: node --test scripts/aevora-release-readiness-contract.test.mjs
      - name: Run revision worker security contract tests
        run: node --test scripts/aevora-revision-worker-security-contract.test.mjs
      - name: Run revision idempotency contract tests
        run: node --test scripts/aevora-revision-idempotency-contract.test.mjs
      - name: Run provider-state grants contract tests
        run: node --test scripts/aevora-provider-state-grants-contract.test.mjs
      - name: Run provider cooldown recording contract tests
        run: node --test scripts/aevora-provider-cooldown-recording-contract.test.mjs
      - name: Run provider schema provenance read-only contract tests
        run: node --test scripts/aevora-provider-schema-provenance-contract.test.mjs
      - name: Run publication schema provenance read-only contract tests
        run: node --test scripts/aevora-publication-schema-provenance-contract.test.mjs
      - name: Run legacy schedule disposition inventory read-only contract tests
        run: node --test scripts/aevora-legacy-schedule-disposition-inventory-contract.test.mjs
      - name: Run repository-wide Gemini quota guard contract tests
        run: node --test scripts/aevora-gemini-quota-guard-contract.test.mjs
      - name: Run read-only access audit contract tests
        run: node --test scripts/aevora-readonly-access-audit-contract.test.mjs
      - name: Run internal worker authorization contract tests
        run: node --test scripts/aevora-internal-worker-auth-contract.test.mjs


  readiness-migration-test:
    name: Rehearse readiness migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aevora_readiness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aevora_readiness_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay readiness migration and assert runtime invariants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevora_readiness_test
          AEVORA_DISPOSABLE_MIGRATION_REHEARSAL: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: bash scripts/test-aevora-readiness-migration.sh

      - name: Rehearse readiness against concurrent series completion
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevora_readiness_concurrency
          AEVORA_DISPOSABLE_CONCURRENCY_REHEARSAL: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE aevora_readiness_concurrency"
          bash scripts/test-aevora-readiness-concurrency.sh

      - name: Rehearse reader-event integrity and INSERT-only grants
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevora_reader_event_test
          AEVORA_DISPOSABLE_READER_EVENT_REHEARSAL: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE aevora_reader_event_test"
          bash scripts/test-aevora-reader-event-integrity.sh

      - name: Rehearse trending aggregate state and closed ACLs
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevora_trending_test
          AEVORA_DISPOSABLE_TRENDING_REHEARSAL: I_UNDERSTAND_THIS_IS_DISPOSABLE
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE aevora_trending_test"
          bash scripts/test-aevora-trending-state.sh

      - name: Parse read-only provider and publication schema inventories on disposable PostgreSQL
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aevora_schema_inventory_test
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE aevora_schema_inventory_test"
          for inventory in docs/aevora/phase1-provider-state-schema-provenance.sql docs/aevora/phase1-publication-schema-provenance.sql; do
            {
              echo 'BEGIN TRANSACTION READ ONLY;'
              cat "$inventory"
              echo
              echo 'ROLLBACK;'
            } | psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1
          done
