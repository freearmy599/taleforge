name: Aevora Control Plane Audit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/aevora-control-plane-audit.mjs"
      - ".github/workflows/aevora-control-plane-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: aevora-control-plane-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only control-plane audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEVORA_AUDIT_URL: https://sxmbnlgufqhcwxcpcsvb.supabase.co/functions/v1/aevora-control-plane-audit
          AEVORA_AUDIT_TOKEN: ${{ secrets.AEVORA_AUDIT_TOKEN }}
        run: node scripts/aevora-control-plane-audit.mjs
