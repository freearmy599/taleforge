name: Aevora Control Plane Audit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/aevora-control-plane-audit.mjs"
      - "scripts/aevora-control-plane-audit.contract.test.mjs"
      - "supabase/functions/aevora-control-plane-audit/index.ts"
      - ".github/workflows/aevora-control-plane-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: aevora-control-plane-audit
  cancel-in-progress: false

jobs:
  contract:
    name: Validate audit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test audit failure and redaction contracts
        run: node --test scripts/aevora-control-plane-audit.contract.test.mjs

  audit:
    name: Run live read-only audit
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only control-plane audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AEVORA_AUDIT_URL: https://sxmbnlgufqhcwxcpcsvb.supabase.co/functions/v1/aevora-control-plane-audit
          AEVORA_AUDIT_TOKEN: ${{ secrets.AEVORA_AUDIT_TOKEN }}
        run: node scripts/aevora-control-plane-audit.mjs
