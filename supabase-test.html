<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaleForge — Supabase Test</title>
</head>

<body>
  <h1>TaleForge Database Test</h1>
  <p id="status">Testing connection...</p>

  <script type="module">
    import "./supabase-client.js";

    const status = document.getElementById("status");

    async function testSupabase() {
      try {
        const { data, error } =
          await window.taleForgeSupabase
            .from("genres")
            .select("name")
            .limit(1);

        if (error) {
          throw error;
        }

        status.textContent =
          "Supabase connected successfully. Database is responding.";
      } catch (error) {
        console.error(error);

        status.textContent =
          "Connection failed: " + error.message;
      }
    }

    testSupabase();
  </script>
</body>
</html>
