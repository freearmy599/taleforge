# Internal workers validate their server-held API key inside the handler.
# New Supabase secret API keys are not JWTs, so gateway JWT verification must be
# disabled for these endpoints; handler-level authentication remains mandatory.
# Keep this list aligned with scripts/aevora-internal-worker-auth-contract.test.mjs.

[functions.arc-planner]
verify_jwt = false

