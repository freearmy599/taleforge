<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>TaleForge Review Orchestrator Test</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b0f14;
      color: #e8f1f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #9aa9b6;
      line-height: 1.6;
    }

    button {
      margin-top: 16px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #00bcd4;
      color: #061014;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    pre {
      margin-top: 20px;
      padding: 18px;
      background: #111820;
      border: 1px solid #263440;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>TaleForge Review Orchestrator Test</h1>

    <p>
      This page performs a SAFE dry-run of the Review Orchestrator.
      It does not generate, revise, or publish a chapter.
    </p>

    <button id="runTest">
      Run Dry Run
    </button>

    <pre id="result">Ready.</pre>

  </div>

  <script type="module">

    import {
      taleForgeSupabase
    } from "./supabase-client.js";


    /*
      Chapter 2 output being used for the test.
    */

    const OUTPUT_ID =
      "a980c498-1c9d-46c6-95fe-3490ec48432f";


    const resultElement =
      document.getElementById("result");


    const button =
      document.getElementById("runTest");


    button.addEventListener("click", async () => {

      button.disabled = true;

      resultElement.textContent =
        "Running Review Orchestrator dry run...\n\nPlease wait.";


      try {

        const {
          data,
          error
        } =
          await taleForgeSupabase.functions.invoke(
            "review-orchestrator",
            {
              body: {
                output_id: OUTPUT_ID,
                dry_run: true
              }
            }
          );


        if (error) {

          let responseBody = null;


          try {

            if (
              error.context &&
              error.context.response
            ) {

              responseBody =
                await error.context.response.text();

            }

          } catch (readError) {

            responseBody =
              "Could not read error response: " +
              String(readError);

          }


          resultElement.textContent =
            JSON.stringify(
              {
                success: false,
                error: error.message,
                response_body: responseBody
              },
              null,
              2
            );

          return;

        }


        resultElement.textContent =
          JSON.stringify(
            data,
            null,
            2
          );

      } catch (error) {

        resultElement.textContent =
          JSON.stringify(
            {
              success: false,
              error:
                error instanceof Error
                  ? error.message
                  : String(error)
            },
            null,
            2
          );

      } finally {

        button.disabled = false;

      }

    });

  </script>

</body>
</html>
